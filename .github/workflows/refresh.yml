name: update

on:
  schedule:
    # UTC. 13:00/19:00 = 9am/3pm New York during EDT; both shift an hour
    # earlier when clocks go back in November.
    - cron: "0 13 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      resummarize:
        description: "redo count"
        default: "0"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESUMMARIZE: ${{ inputs.resummarize }}
        run: node scripts/refresh.mjs

      - run: |
          git config user.name "bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nyc.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "update"
            git push
          fi
