name: update

on:
  schedule:
    # Every three hours at :40 — 12:40 and 18:40 UTC land at 8:40am and 2:40pm
    # New York during EDT, the two times that actually matter, and the rest are
    # insurance. GitHub drops scheduled runs under load (a 13:00 cron here never
    # fired once), so the fix is to stop depending on any single one; a missed
    # run is invisible when the next is three hours out. Extra runs are close to
    # free: summaries are only generated for shows we have never seen.
    #
    # Not on the hour, deliberately — that is the most contended slot on the
    # scheduler, and :40 also means a typical delay still lands before 9am/3pm.
    - cron: "40 */3 * * *"
    # TEMPORARY probe — checking whether GitHub honours a schedule on this repo
    # at all. Remove once we have the answer.
    - cron: "13 15 * * *"
  workflow_dispatch:
    inputs:
      resummarize:
        description: "redo count"
        default: "0"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESUMMARIZE: ${{ inputs.resummarize }}
        run: node scripts/refresh.mjs

      - run: |
          git config user.name "bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nyc.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "update"
            git push
          fi
