name: update

on:
  schedule:
    # UTC. 12:40/18:40 = 8:40am/2:40pm New York during EDT; both shift an hour
    # earlier when clocks go back in November.
    #
    # Deliberately not on the hour: GitHub queues every :00 cron in the world at
    # once and drops what it cannot service, which is why the 13:00 run never
    # fired. Twenty minutes early also means a typical delay still lands the
    # refresh before 9am/3pm rather than after.
    - cron: "40 12 * * *"
    - cron: "40 18 * * *"
    # TEMPORARY probe — checking whether GitHub honours a schedule on this repo
    # at all. Remove once we have the answer.
    - cron: "13 15 * * *"
  workflow_dispatch:
    inputs:
      resummarize:
        description: "redo count"
        default: "0"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESUMMARIZE: ${{ inputs.resummarize }}
        run: node scripts/refresh.mjs

      - run: |
          git config user.name "bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nyc.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "update"
            git push
          fi
