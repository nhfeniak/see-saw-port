name: update

on:
  schedule:
    # DOES NOT WORK — kept armed in case it ever starts.
    #
    # As of 2026-09-05 GitHub has never fired a single scheduled run on this
    # repo: four consecutive misses, including one after a disable/enable
    # re-registration, while every manual run succeeded. Most likely broken by
    # the repo rename. Refreshing is manual, via the "Refresh" link on the page.
    #
    # If it does start working, :40 past every third hour puts two runs at
    # 8:40am and 2:40pm New York (EDT), and off-the-hour avoids the most
    # contended scheduler slot.
    - cron: "40 */3 * * *"
  workflow_dispatch:
    inputs:
      resummarize:
        description: "redo count"
        default: "0"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESUMMARIZE: ${{ inputs.resummarize }}
        run: node scripts/refresh.mjs

      - run: |
          git config user.name "bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nyc.json data/instagram.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "update"
            git push
          fi
