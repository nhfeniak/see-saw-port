<!doctype html>
<html lang="en" data-scene="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>See Saw Port</title>
<style>
  /* ------------------------------------------------------------------
     Tribeca from above. Two scenes, set per page on <html data-scene>:
       night  — Openings. An opening reception after dark.
       day    — On View. Satellite daylight.
     Roof, asphalt and shadow colours are sampled from aerial photographs
     of Tribeca, not invented. The one rule they follow that matters:
     lit surfaces run warm, shadowed surfaces run cool/blue. Flat grey
     in both directions is what makes fake aerials look fake.
     Shapes are rectangles and circles only. No gradients, no transparency:
     everything is a flat block of one colour.
     ------------------------------------------------------------------ */

  :root[data-scene="day"] {
    --void:        #9C918C;   /* open ground, sunlit */   /* avenue, in sun */   /* between buildings — they shade their own gap */   /* sidewalk concrete */   /* lane paint */
    --ink:         #141319;
    --chrome:      #E8E7E7;   /* same stock as a white-membrane roof */
    --chrome2:     #D2CFCA;
    --plate:       #EDEBE6;
    --plate-ink:   #141319;
    --chrome-ink:  #141319;
    --mark:        #E8B830;   /* the yellow of a cab */
    --bookmark:    #FFD91A;
    --location:    #1E5FD8;
  }

  :root[data-scene="night"] {
    --void:        #0C0A0A;   /* under a lamp */   /* the gaps, away from the lamps */
    --ink:         #F0EDE6;
    --chrome:      #26232B;   /* same stock as the palest night roof */
    --chrome2:     #35313C;
    --plate:       #2A2730;
    --plate-ink:   #F0EDE6;
    --chrome-ink:  #F0EDE6;
    --mark:        #E8B830;
    --bookmark:    #FFD91A;
    --location:    #1E5FD8;
  }

  * {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -moz-text-size-adjust: none;
  }

  html { background: var(--void); }

  body {
    margin: 0;
    background: none;
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    line-height: 1.4;
    padding: 0 12px 12px 0;   /* roofs run to the left edge, and to the top */
    max-width: 640px;
  }

  /* the street lives on a fixed canvas behind everything; roofs are opaque
     DOM on top of it, so you only see down in the gaps they leave */
  #scene {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
    pointer-events: none;
    display: block;
  }

  body > * { position: relative; z-index: 1; }

  a { color: inherit; }

  /* One box across the top for everything, built like a listing's roof —
     no rules, no plates, nothing dividing it. */
  h1.site, .meta, nav.top, .tabs {
    background: var(--chrome);
    color: var(--chrome-ink);
    border: none;
    margin: 0 var(--gutter, 38px) 0 0;   /* as wide as a roof: it must not cover the street */
    padding: 4px 11px;
  }

  /* Every row of the box is 4px of padding top and bottom, so every gap
     between two of them is the same 8px. The first and last row carry a
     little more against the outside edge — and which row is last depends on
     whether the page has subtabs, which only the script knows. */
  h1.site { font-size: 22px; font-weight: bold; padding-top: 10px; }

  nav.top {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 14px;
  }

  nav.top { padding-bottom: 10px; }
  :root[data-subtabs] nav.top { padding-bottom: 4px; }

  nav.top a { text-decoration: underline; cursor: pointer; font-weight: bold; }
  nav.top a.active { text-decoration: none; }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 12px;
    padding-bottom: 10px;
  }

  .tabs a { text-decoration: underline; cursor: pointer; }
  .tabs a.active { text-decoration: none; font-weight: bold; }

  /* ---- a date / neighbourhood subtitle ----
     It gets a roof like any listing, at the head of the island it names, so
     the street breaks above it rather than below. Straight below the camera
     the roofs and the ground line up and
     the gap is only the street; away from the centre the two planes separate
     and a strip of the building wall shows, which is where the shopfront is
     drawn. */
  .head-roof {
    margin-right: var(--gutter, 38px);
    padding: 12px 11px 13px;
    background: var(--roof);
    color: var(--roof-ink);
    font-weight: bold;
    font-size: 22px;
  }

  .date-head {
    box-sizing: border-box;
    height: var(--cross-h, 100px);   /* pavement, parking, lane, parking, pavement */
    margin: 0;
    background: none;
  }

  .head-roof .daymap-link {
    font-size: 14px;
    font-weight: normal;
    text-decoration: underline;
    cursor: pointer;
  }

  .entries { display: block; }
  .maplist { margin-top: 0; }

  /* under the map there is no city to stand on — the listings sit on cloud */
  .maplist .entry-main {
    background: none;
    color: var(--plate-ink);
  }

  /* ---- one building per listing ----------------------------------
     column 1 is the roof, column 2 is the pavement beside it where the
     bookmark sits; the row underneath is the gap you see down through. */
  .entry {
    display: grid;
    /* the second column IS the street, set from GUTTER in script */
    grid-template-columns: 1fr var(--gutter, 38px);
  }

  /* one building, one flat colour, as tall as its own text needs */
  .entry-main {
    grid-column: 1;
    grid-row: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--roof);
    color: var(--roof-ink);
    padding: 9px 11px 10px;
  }

  .entry-text { flex: 1; min-width: 0; }

  .entry .title {
    display: block;
    font-size: 14px;
    line-height: 1.4;
    font-weight: bold;
    text-decoration: none;
  }

  .entry .sub { display: block; font-size: 14px; line-height: 1.4; }
  .entry .addr-link { text-decoration: none; }

  .entry .summary { font-style: italic; }

  /* ---- bookmark: a ring on the roof, filled when marked ---- */
  .bm {
    flex: none;
    width: 30px;
    height: 30px;
    padding: 0;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* unmarked: an outline in whatever colour the text beside it is */
  .bm::after {
    content: "";
    box-sizing: border-box;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: none;
    box-shadow: inset 0 0 0 1px var(--roof-ink);
  }

  /* marked: taxi yellow, the same in both scenes */
  .bm.on::after {
    background: var(--mark);
    box-shadow: none;
  }

  .empty { margin-right: var(--gutter, 38px); padding: 10px 11px; background: var(--chrome); color: var(--chrome-ink); }

  /* Above the clouds there is no street to leave room for and nothing to
     stand on, so the interface is just text across the full width. */
  :root[data-mode="clouds"] h1.site,
  :root[data-mode="clouds"] .meta,
  :root[data-mode="clouds"] nav.top,
  :root[data-mode="clouds"] .tabs,
  :root[data-mode="clouds"] .empty {
    margin-right: 0;
    background: none;
  }

  /* the listings under a map have no street beside them either */
  :root[data-mode="clouds"] .entry { grid-template-columns: 1fr; }

  /* no roof up here, so the ring takes the colour of the text it sits beside
     rather than of a building that is not being drawn */
  :root[data-mode="clouds"] .bm:not(.on)::after { box-shadow: inset 0 0 0 1px var(--chrome-ink); }
  :root[data-mode="clouds"] .entry-main { padding-right: 11px; }
  :root[data-mode="clouds"] .head-roof { margin-right: 0; background: none; color: var(--chrome-ink); }

  /* ---- maps ---- */
  /* the controls stand off the map by exactly the gap between them */
  .map-controls {
    position: absolute;
    left: calc(var(--map-pad-x) + var(--map-gap));
    bottom: calc(var(--map-pad-y) + var(--map-gap));
    z-index: 3;
    display: flex;
    align-items: center;
    gap: var(--map-gap);
    margin: 0;
    padding: 0;
    background: none;
  }

  .map-controls button {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    font-weight: bold;
    color: var(--map-btnink);
    background: var(--map-btn);
    border: none;
    width: 32px;
    height: 32px;
    cursor: pointer;
  }

  .map-controls button.loc::after {
    content: "";
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--location);
  }

  /* the opening in the cloud is inset, so the glow has somewhere to fall */
  :root { --map-pad-x: 22px; --map-pad-y: 20px; --map-gap: 8px; }
  .mapframe { position: relative; padding: var(--map-pad-y) var(--map-pad-x); }

  .mapwrap {
    max-height: 70vh;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }

  .mapinner { position: relative; }
  .mapinner svg { display: block; max-width: none; }

  /* the basemap carries its own greys; repaint them to match the scene.
     #mapinner beats the <style> inside the SVG on specificity. */
  /* The map is the same city from much further up, so it is painted out of
     the list view's own palette — blocks are roof stock, the grid between them
     is the street, the strokes are lit pavement. The values come from SCENE,
     so the two pages cannot drift apart again. */
  #mapinner .st0 { fill: var(--map-grid); }
  #mapinner .st1 { fill: var(--map-block); }
  #mapinner .st2 { opacity: 1; fill: var(--map-block); }
  #mapinner .st3 { stroke: var(--map-line); }

  /* The basemap carries a real street hierarchy — motorway, major, minor, and
     a casing under each of the big ones — so the night view is lit off that
     rather than off a guess. Broadest selector first: every id here begins
     with one of the others, and they all have the same weight. */
  #mapinner g[id^="motorway"] path      { stroke: var(--map-line3); }
  #mapinner g[id^="motorway_link"] path { stroke: var(--map-line2); }
  #mapinner g[id^="major_road"] path    { stroke: var(--map-line2); }
  #mapinner g[id^="minor_road"] path    { stroke: var(--map-line); }
  /* The casing under a big road is the same geometry at the same width, so it
     was hidden underneath it. Widened and set between the ground and the road
     it becomes the bloom a bright street has from the air. Night only: by day
     there is nothing to bloom. */
  #mapinner g[id*="__border"] path      { stroke: var(--map-halo); }
  :root[data-scene="night"] #mapinner g[id*="__border"] path { stroke-width: 2.2; }
  /* and the patches, which outrank all of it */
  #mapinner path.st3.lit  { stroke: var(--map-lit); }
  #mapinner path.st3.dim  { stroke: var(--map-line0); }

  /* The rivers are the only paths in the basemap carrying no class, so they
     kept their default black and read as holes once the land went light. */
  #mapinner path:not([class]) { fill: var(--map-water); }

  .dot {
    position: absolute;
    width: 30px;
    height: 30px;
    margin: -15px 0 0 -15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* A dot is a person on the pavement seen from much higher up, so it is
     drawn the size of one. The 30px anchor around it stays: that is the thing
     you have to hit with a thumb. */
  .dot::after {
    content: "";
    box-sizing: border-box;
    width: var(--dot-d, 11px);
    height: var(--dot-d, 11px);
    border-radius: 50%;
    background: var(--dot-face, #000);
  }

  /* bookmarked reads yellow on the map, as before */
  .dot.on::after { background: var(--bookmark); }

  /* where you are is a dot like any other, so it is drawn like one */
  .me {
    position: absolute;
    width: var(--dot-d, 11px);
    height: var(--dot-d, 11px);
    margin: calc(var(--dot-d, 11px) / -2) 0 0 calc(var(--dot-d, 11px) / -2);
    border-radius: 50%;
    background: var(--location);
    pointer-events: none;
  }

  .dot-label {
    position: absolute;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--map-label);
    white-space: nowrap;
    pointer-events: none;
  }

  :root[data-scene="night"] { --map-label: #F0EDE6; }
  :root[data-scene="day"]   { --map-label: #000000; }

  @media (prefers-reduced-motion: reduce) {
    /* the scene still draws, it just stops moving */
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<h1 class="site">See Saw Port</h1>
<div class="meta" id="updated">loading...</div>
<nav class="top" id="topnav"></nav>

<div id="content">loading...</div>

<script>
  const NYC_TZ = "America/New_York";
  const HAMPTONS = "hamptons";
  const DEFAULT_MAP_CENTER = { lat: 40.718, lon: -74.001 }; // lower Manhattan

  // The traced basemap does not sit quite where the coordinates put it, so dots
  // drifted off their buildings. These two numbers are an eyeballed nudge, not a
  // survey: they were arrived at by looking at downtown at deep zoom and saying
  // "about the gap between those two galleries, that way" — the gallery pairs
  // were a convenient ruler, nothing more. So treat them as approximate, and
  // safe to re-tune by eye.
  //
  // Applied to the projection rather than by nudging the basemap: moving the art
  // leaves an uncovered strip at the edges, and the artboard crop is deliberate.
  // Both are under a pixel and a half — invisible until the deep zoom levels,
  // where they amount to most of a block. Only checked downtown, so if the art
  // is also rotated or scaled this will drift further out.
  const PLOT_DX = -1.2866;
  const PLOT_DY = -0.9131;
  let userLoc = null; // {lat, lon} once the browser gives us a fix
  let locationOn = false;
  let locationTimer = null;
  const LOCATION_INTERVAL_MS = 20000;

  // vector basemap artboard: viewBox 0 0 1040 1665.9, corners given as lat/long
  const ARTBOARD_W = 1040;
  const ARTBOARD_H = 1665.9;
  const ARTBOARD_LAT_MAX = 40 + 51 / 60 + 30.7 / 3600;   // top-left    40°51'30.7"N
  const ARTBOARD_LON_MIN = -(74 + 3 / 60 + 22.5 / 3600); // top-left    74°03'22.5"W
  const ARTBOARD_LAT_MIN = 40 + 38 / 60 + 31.8 / 3600;   // bottom-right 40°38'31.8"N
  const ARTBOARD_LON_MAX = -(73 + 52 / 60 + 38.1 / 3600);// bottom-right 73°52'38.1"W

  let latestShows = null;
  let bookmarks = new Set();
  let onViewNeighborhood = null; // null = All
  // Rows pinned to the top of the map list. A show joins when bookmarked and
  // never leaves until the page is reloaded, so un-bookmarking by mistake does
  // not reorder the row out from under the tap.
  let stickyTop = new Set();
  let mapPoints = [];    // what is plotted in the current map view
  let mapKind = null;    // "opening" | "onview"
  let mapListSig = "";   // last rendered row order, to skip redundant repaints
  let currentPage = "opening";
  let openingMapDate = null; // NYC date-key ("YYYY-MM-DD") of the selected day subtab

  // shared "camera" state for every map view (Openings Map + On View Map share
  // one camera so switching tabs/subtabs keeps you looking at the same spot)
  let mapScale = null;
  let mapCenterImgX = null;
  let mapCenterImgY = null;

  const PAGES = [
    { id: "opening", label: "Openings" },
    { id: "onview", label: "On View" },
    { id: "opening-map", label: "Openings Map" },
    { id: "onview-map", label: "On View Map" },
  ];

  function fmtUpdated(iso) {
    if (!iso) return "no data yet";
    const d = new Date(iso);
    return "Updated " + new Intl.DateTimeFormat("en-US", {
      timeZone: NYC_TZ, month: "short", day: "numeric",
      hour: "numeric", minute: "2-digit"
    }).format(d);
  }

  // Bookmarks are per-device: localStorage only, never sent anywhere. A show
  // starred on the laptop is NOT starred on the phone.
  function applyBookmarkStyles() {
    document.querySelectorAll(".bm[data-id]").forEach(b => {
      const on = bookmarks.has(b.dataset.id);
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    document.querySelectorAll(".dot[data-id]").forEach(d => {
      d.classList.toggle("on", bookmarks.has(d.dataset.id));
    });
  }

  const BOOKMARK_KEY = "seesawport.bookmarks";

  // Which tab and sub-tab you were on, so a reload puts you back. Deliberately
  // sessionStorage, not local: reloading mid-visit should not lose your place,
  // but opening the app fresh tomorrow should start at Openings rather than on
  // some stale day's map. Note this does NOT preserve the pinned bookmark rows
  // — clearing those is exactly what a reload is for.
  const VIEW_KEY = "seesawport.view";

  function saveView() {
    try {
      sessionStorage.setItem(VIEW_KEY, JSON.stringify({
        page: currentPage,
        nbhd: onViewNeighborhood,
        day: openingMapDate,
      }));
    } catch (e) {
      // storage unavailable — the app just always opens on Openings
    }
  }

  function restoreView() {
    let saved = null;
    try {
      saved = JSON.parse(sessionStorage.getItem(VIEW_KEY) || "null");
    } catch (e) {
      return;
    }
    if (!saved) return;
    // Validate rather than trust: a stored page id could be from an older
    // build, and the stored day/neighborhood may no longer exist in the data.
    // Both of those are re-checked at render, which falls back cleanly.
    if (PAGES.some(p => p.id === saved.page)) currentPage = saved.page;
    if (saved.nbhd === null || typeof saved.nbhd === "string") onViewNeighborhood = saved.nbhd;
    if (saved.day === null || typeof saved.day === "string") openingMapDate = saved.day;
  }

  function loadBookmarks() {
    try {
      const raw = localStorage.getItem(BOOKMARK_KEY);
      bookmarks = new Set(raw ? JSON.parse(raw).map(String) : []);
    } catch (e) {
      bookmarks = new Set(); // private window, blocked storage, corrupt value
    }
    stickyTop = new Set(bookmarks);
  }

  function toggleBookmark(id) {
    const key = String(id);
    if (bookmarks.has(key)) {
      bookmarks.delete(key); // stays pinned — stickyTop is not touched here
    } else {
      bookmarks.add(key);
      stickyTop.add(key);
    }
    applyBookmarkStyles();
    updateMapList();
    try {
      localStorage.setItem(BOOKMARK_KEY, JSON.stringify([...bookmarks]));
    } catch (e) {
      // storage unavailable — the toggle still works for this visit
    }
  }

  // GitHub's scheduler will not fire for this repo, so the refresh is manual:
  // the link opens the workflow's own page, where "Run workflow" starts it.
  // Data appears here a couple of minutes later, once Pages rebuilds.
  const REFRESH_URL = "https://github.com/nhfeniak/see-saw-port/actions/workflows/refresh.yml";

  function renderUpdatedLine() {
    const el = document.getElementById("updated");
    if (!el) return;
    el.textContent = fmtUpdated(latestShows ? latestShows.fetched_at : null) + " ";
    const a = document.createElement("a");
    a.href = REFRESH_URL;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "Refresh";
    el.appendChild(a);
  }

  function dateOnly(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  function todayNYC() {
    const parts = new Intl.DateTimeFormat("en-CA", { timeZone: NYC_TZ }).format(new Date());
    const [y, m, d] = parts.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  function nycDateKey(isoNoZone) {
    const d = new Date(isoNoZone + "Z");
    return new Intl.DateTimeFormat("en-CA", { timeZone: NYC_TZ }).format(d);
  }

  // The openings list rolls over at 9am NYC, matching the morning refresh —
  // so tonight's 6pm reception still shows for the rest of tonight, rather
  // than dropping off the moment it starts.
  function openingsCutoffKey() {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: NYC_TZ, year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", hourCycle: "h23"
    }).formatToParts(new Date());
    const get = t => parts.find(p => p.type === t).value;
    const d = new Date(Number(get("year")), Number(get("month")) - 1, Number(get("day")));
    if (Number(get("hour")) < 9) d.setDate(d.getDate() - 1);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function fmtDateHeading(dateKey) {
    const [y, m, d] = dateKey.split("-").map(Number);
    const dateObj = new Date(y, m - 1, d);
    return new Intl.DateTimeFormat("en-US", { weekday: "short", month: "short", day: "numeric" }).format(dateObj);
  }

  function capWords(s) {
    return (s || "").replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1));
  }

  function escapeHTML(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function isHamptons(show) {
    return (show.neighborhood || "").toLowerCase() === HAMPTONS;
  }

  function directionsLink(show) {
    if (show.address1) {
      const q = [show.address1, "New York, NY"].filter(Boolean).join(", ");
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
    }
    if (show.latitude && show.longitude) {
      return `https://www.google.com/maps/search/?api=1&query=${show.latitude},${show.longitude}`;
    }
    return null;
  }

  function addressOnly(show) {
    if (!show.address1) return "";
    return show.address1 + (show.address2 ? ", " + show.address2 : "");
  }

  // Roof colours, sampled from the aerials, in roughly the proportions the
  // photographs show: mostly pale membrane, a solid minority of dark EPDM,
  // and a few accents. Assigned by a hash of the show id so a building keeps
  // its roof between renders instead of flickering on every repaint.
  const ROOFS = {
    day:   [["#E8E7E7", 34], ["#C5B9B6", 26], ["#6B6460", 18], ["#4F4650", 22]],
    night: [["#131218", 30], ["#191720", 28], ["#1F1C25", 24], ["#26232B", 18]],
  };
  const INK_DARK = "#141319", INK_LIGHT = "#F0EDE6";

  const toRGB = (h) => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
  const toHex = (c) => "#" + c.map(v => Math.round(v).toString(16).padStart(2, "0")).join("");

  function relLum(hex) {
    const n = parseInt(hex.slice(1), 16);
    const f = c => (c /= 255) <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    return 0.2126 * f(n >> 16 & 255) + 0.7152 * f(n >> 8 & 255) + 0.0722 * f(n & 255);
  }
  const contrast = (a, b) => {
    const [x, y] = [relLum(a), relLum(b)].sort((m, n) => n - m);
    return (x + 0.05) / (y + 0.05);
  };

  function hashId(id) {
    let x = 2166136261;
    const s = String(id);
    for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); }
    return (x >>> 0);
  }

  function roofOf(seed) {
    const table = ROOFS[sceneKind] || ROOFS.night;
    let n = hashId(seed) % 100, roof = table[0][0];
    for (const [hex, w] of table) { if (n < w) { roof = hex; break; } n -= w; }
    // whichever ink reads better on that roof, rather than a fixed threshold —
    // the mid greys sit right where a threshold picks the wrong one
    const ink = contrast(roof, INK_DARK) >= contrast(roof, INK_LIGHT) ? INK_DARK : INK_LIGHT;
    return { roof, ink };
  }
  const roofFor = (show) => roofOf(show.id);
  const roofStyle = (sk) => `--roof:${sk.roof};--roof-ink:${sk.ink}`;

  function entryHTML(show) {
    const titleText = show.title || show.headline || show.name;
    const combinedTitle = show.artist ? `${show.artist} – ${titleText}` : titleText;
    const dl = directionsLink(show);
    const addr = addressOnly(show);
    const galleryName = escapeHTML(show.name);
    // the gallery name links to its Instagram where we have one, since that is
    // where galleries actually post; otherwise to the website from the feed
    const galleryHref = show.instagram
      ? `https://www.instagram.com/${show.instagram}/`
      : (show.url || "");
    const galleryLinked = galleryHref
      ? `<a class="addr-link" href="${escapeHTML(galleryHref)}" target="_blank" rel="noopener">${galleryName}</a>`
      : galleryName;
    const galleryLine = (dl && addr)
      ? `${galleryLinked}, <a class="addr-link" href="${dl}" target="_blank" rel="noopener">${escapeHTML(addr)}</a>`
      : galleryLinked + (addr ? `, ${escapeHTML(addr)}` : "");
    const sk = roofFor(show);
    return `
      <div class="entry" style="${roofStyle(sk)}">
        <div class="entry-main">
          <div class="entry-text">
            <a class="title" href="${escapeHTML(show.share_url || "")}" target="_blank" rel="noopener">${escapeHTML(combinedTitle)}</a>
            <div class="sub">${galleryLine}</div>
            ${show.summary ? `<div class="sub summary">${escapeHTML(show.summary)}</div>` : ""}
          </div>
          <button class="bm" type="button" data-id="${show.id}" aria-pressed="false" aria-label="Bookmark this show"></button>
        </div>
      </div>`;
  }

  function groupByKey(items, keyFn, sortFn) {
    const map = new Map();
    for (const it of items) {
      const k = keyFn(it);
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(it);
    }
    return [...map.entries()].sort(sortFn || ((a, b) => a[0].localeCompare(b[0])));
  }

  // fixed display order, Manhattan first then out of it
  const NEIGHBORHOOD_ORDER = ["downtown", "chelsea", "uptown", "brooklyn", "hamptons"];

  function neighborhoodRank(n) {
    const i = NEIGHBORHOOD_ORDER.indexOf((n || "").toLowerCase());
    return i === -1 ? NEIGHBORHOOD_ORDER.length : i;
  }

  // Every list runs north to south. Manhattan used to run the other way, which
  // meant Brooklyn and the Hamptons needed an exception; with one direction
  // throughout, the exception is gone.

  // In the list views a bookmarked show rises to the top of the section it is
  // already in — its date, or its neighborhood — not to the top of the page.
  // Order within each half is left alone, so both still run north to south.
  function bookmarkedFirst(items) {
    const marked = [];
    const rest = [];
    for (const s of items) {
      (bookmarks.has(String(s.id)) ? marked : rest).push(s);
    }
    return marked.concat(rest);
  }

  function sortByLatitude(items) {
    return items.slice().sort((a, b) => b.latitude - a.latitude);
  }

  function renderGroupedByDate(groups) {
    return groups.map(([dateKey, items]) => `
      <div class="date-head" data-key="${escapeHTML(dateKey)}"></div>
      <div class="head-roof" style="${roofStyle(roofOf(dateKey))}">${fmtDateHeading(dateKey)} <a class="daymap-link" data-date="${dateKey}">Map</a></div>
      <div class="entries">${items.map(entryHTML).join("")}</div>
    `).join("");
  }

  function computeLists(shows) {
    const today = todayNYC();

    const cutoffKey = openingsCutoffKey();
    const openingSoon = shows
      .filter(s => s.opening_start_time && !isHamptons(s))
      .filter(s => nycDateKey(s.opening_start_time) >= cutoffKey)
      .sort((a, b) => a.opening_start_time.localeCompare(b.opening_start_time));

    const onView = shows
      .filter(s => s.starts && s.ends && s.starts <= s.ends)
      .filter(s => dateOnly(s.starts) <= today && dateOnly(s.ends) >= today)
      .sort((a, b) => a.ends.localeCompare(b.ends));

    return { openingSoon, onView };
  }

  // north to south, with Brooklyn kept together at the end
  function geoSort(items) {
    return items.slice().sort((a, b) => {
      const aBk = (a.neighborhood || "").toLowerCase() === "brooklyn";
      const bBk = (b.neighborhood || "").toLowerCase() === "brooklyn";
      if (aBk !== bBk) return aBk ? 1 : -1;
      return b.latitude - a.latitude;
    });
  }

  function renderOpeningPage() {
    if (!latestShows) return `<div class="empty">no data yet</div>`;
    const { openingSoon } = computeLists(latestShows.shows);
    if (!openingSoon.length) return `<div class="empty">nothing upcoming</div>`;
    const groups = groupByKey(openingSoon, s => nycDateKey(s.opening_start_time))
      .map(([dateKey, items]) => [dateKey, bookmarkedFirst(geoSort(items))]);
    return renderGroupedByDate(groups);
  }

  function renderOnViewPage() {
    if (!latestShows) return `<div class="empty">no data yet</div>`;
    const { onView } = computeLists(latestShows.shows);

    // Sub-tabs in the same style as the openings map's date tabs. "All" leaves
    // out the Hamptons, which are a drive away and only wanted deliberately.
    const neighborhoods = [...new Set(onView.map(s => s.neighborhood).filter(Boolean))]
      .sort((a, b) => neighborhoodRank(a) - neighborhoodRank(b) || a.localeCompare(b));
    if (onViewNeighborhood !== null && !neighborhoods.includes(onViewNeighborhood)) {
      onViewNeighborhood = null; // stored tab no longer has anything on view
    }
    const allShows = onView.filter(s => !isHamptons(s));
    const tabs = `<div class="tabs">
      <a data-nbhd="" class="${onViewNeighborhood === null ? "active" : ""}">All (${allShows.length})</a>
      ${neighborhoods.map(n => {
        const count = onView.filter(s => (s.neighborhood || "") === n).length;
        return `<a data-nbhd="${escapeHTML(n)}" class="${onViewNeighborhood === n ? "active" : ""}">${escapeHTML(capWords(n))} (${count})</a>`;
      }).join("")}
    </div>`;

    const pool = onViewNeighborhood === null
      ? allShows
      : onView.filter(s => (s.neighborhood || "") === onViewNeighborhood);
    if (!pool.length) return tabs + `<div class="empty">nothing here</div>`;

    // a single neighborhood needs no headings; "All" keeps them as dividers
    if (onViewNeighborhood !== null) {
      return tabs + `<div class="entries">${bookmarkedFirst(sortByLatitude(pool)).map(entryHTML).join("")}</div>`;
    }

    const groups = groupByKey(pool, s => s.neighborhood || "",
      (a, b) => neighborhoodRank(a[0]) - neighborhoodRank(b[0]) || a[0].localeCompare(b[0]));
    return tabs + groups.map(([nbhd, items]) => `
      <div class="date-head" data-key="${escapeHTML(nbhd)}"></div>
      <div class="head-roof" style="${roofStyle(roofOf(nbhd))}">${capWords(nbhd) || "Unknown"}</div>
      <div class="entries">${bookmarkedFirst(sortByLatitude(items)).map(entryHTML).join("")}</div>
    `).join("");
  }

  // the basemap is a hand-cropped vector artboard; corners were given as
  // lat/long, so a plain linear (equirectangular) interpolation across the
  // artboard is the correct mapping — no Mercator/tile math needed anymore.
  function lonToSvgX(lon) {
    return (lon - ARTBOARD_LON_MIN) / (ARTBOARD_LON_MAX - ARTBOARD_LON_MIN) * ARTBOARD_W + PLOT_DX;
  }
  function latToSvgY(lat) {
    return (ARTBOARD_LAT_MAX - lat) / (ARTBOARD_LAT_MAX - ARTBOARD_LAT_MIN) * ARTBOARD_H + PLOT_DY;
  }

  function showsToPoints(shows) {
    const pts = [];
    for (const s of shows) {
      if (!s.latitude || !s.longitude) continue;
      const x = lonToSvgX(s.longitude);
      const y = latToSvgY(s.latitude);
      if (x < 0 || y < 0 || x > ARTBOARD_W || y > ARTBOARD_H) continue;
      pts.push({ x, y, show: s });
    }
    return pts;
  }

  function renderMapPage(kind) {
    if (!latestShows) return `<div class="empty">no show data yet</div>`;

    const { openingSoon, onView } = computeLists(latestShows.shows);
    let shows;
    let subtabsHTML = "";

    if (kind === "opening") {
      const groups = groupByKey(openingSoon, s => nycDateKey(s.opening_start_time));
      if (openingMapDate === null || !groups.some(([k]) => k === openingMapDate)) {
        openingMapDate = groups.length ? groups[0][0] : null;
      }
      subtabsHTML = `<div class="tabs">
        ${groups.map(([dateKey, items]) => `<a data-date="${dateKey}" class="${openingMapDate === dateKey ? "active" : ""}">${fmtDateHeading(dateKey)} (${items.length})</a>`).join("")}
      </div>`;
      const activeGroup = groups.find(([k]) => k === openingMapDate);
      shows = activeGroup ? activeGroup[1] : [];
    } else {
      shows = onView;
    }

    const points = showsToPoints(shows);

    mapPoints = points;
    mapKind = kind;
    mapListSig = "";

    return `
      ${subtabsHTML}
      <div class="mapframe">
      <div class="mapwrap" id="mapwrap">
        <div class="mapinner" id="mapinner">
          ${points.map(p => `
            <a class="dot" data-id="${p.show.id}" data-x="${p.x}" data-y="${p.y}" href="${escapeHTML(p.show.share_url || "")}" target="_blank" rel="noopener" title="${escapeHTML(p.show.title || p.show.headline || p.show.name)}"></a>
            <div class="dot-label" data-x="${p.x}" data-y="${p.y}">${escapeHTML(p.show.name)}</div>
          `).join("")}
          ${userLoc ? `<div class="me" data-x="${lonToSvgX(userLoc.lon)}" data-y="${latToSvgY(userLoc.lat)}"></div>` : ""}
        </div>
      </div>
      <div class="map-controls">
        <button id="zoomOut" aria-label="zoom out">&minus;</button>
        <button id="zoomIn" aria-label="zoom in">+</button>
        <button id="locate" class="loc" aria-label="show my location"></button>
      </div>
      </div>
      <div class="entries maplist" id="maplist"></div>
    `;
  }

  function sortForMap(shows) {
    if (mapKind === "opening") return geoSort(shows);
    return shows.slice().sort((a, b) =>
      neighborhoodRank(a.neighborhood) - neighborhoodRank(b.neighborhood) ||
      b.latitude - a.latitude);
  }

  // Everything on screen, listed underneath — nothing else, bookmarked or not.
  // Being on screen decides whether a row is listed at all; being bookmarked
  // only decides where in that list it sits.
  function updateMapList() {
    const host = document.getElementById("maplist");
    const wrap = document.getElementById("mapwrap");
    if (!host || !wrap || !mapScale) return;

    const left = wrap.scrollLeft;
    const top = wrap.scrollTop;
    const right = left + wrap.clientWidth;
    const bottom = top + wrap.clientHeight;

    const pinned = [];
    const onScreen = [];
    for (const p of mapPoints) {
      const x = p.x * mapScale;
      const y = p.y * mapScale;
      if (x < left || x > right || y < top || y > bottom) continue;
      // still pinned once bookmarked, so an accidental un-bookmark does not
      // drop the row out from under the tap — but only while it is on screen
      if (stickyTop.has(String(p.show.id))) pinned.push(p.show);
      else onScreen.push(p.show);
    }

    const rows = [...sortForMap(pinned), ...sortForMap(onScreen)];
    const sig = rows.map(s => s.id).join(",");
    if (sig === mapListSig) return; // nothing moved; don't rebuild mid-scroll
    mapListSig = sig;
    host.innerHTML = rows.map(entryHTML).join("");
    applyBookmarkStyles();
  }

  function centerOn(wrap, imgX, imgY, scale) {
    wrap.scrollLeft = Math.max(0, imgX * scale - wrap.clientWidth / 2);
    wrap.scrollTop = Math.max(0, imgY * scale - wrap.clientHeight / 2);
  }

  function applyMapScale() {
    const wrap = document.getElementById("mapwrap");
    const inner = document.getElementById("mapinner");
    if (!wrap || !inner) return;
    // may be null on the first paint, before map.svg has arrived, or for good
    // if it failed to load — dots and the list must not depend on it
    const svg = inner.querySelector("svg");

    const fitScale = Math.min(1, wrap.clientWidth / ARTBOARD_W);
    // Three more 1.6x steps than the map alone needs. Past roughly 40 the
    // basemap stops being informative, but the list under it is filtered by
    // what is on screen, so tighter zoom is how you pare a dense block down to
    // a handful of rows.
    const maxScale = 168;

    let needsCenter = false;
    if (mapScale === null) {
      mapScale = Math.max(fitScale, Math.min(maxScale, 1));
      needsCenter = true;
    }
    mapScale = Math.max(fitScale, Math.min(maxScale, mapScale));

    const w = ARTBOARD_W * mapScale;
    const h = ARTBOARD_H * mapScale;
    inner.style.width = w + "px";
    inner.style.height = h + "px";
    if (svg) {
      svg.style.width = w + "px";
      svg.style.height = h + "px";
    }

    // Each label is emitted directly after its dot, so walk the sibling rather
    // than pairing two queries by index — an index pair breaks silently the
    // moment anything else is added between them.
    for (const dot of inner.querySelectorAll(".dot")) {
      const x = parseFloat(dot.dataset.x) * mapScale;
      const y = parseFloat(dot.dataset.y) * mapScale;
      dot.style.left = x + "px";
      dot.style.top = y + "px";
      const label = dot.nextElementSibling;
      if (label && label.classList.contains("dot-label")) {
        label.style.left = x + "px";
        label.style.top = (y + DOT_D / 2 + 3) + "px";
      }
    }
    // labels always show — no crowding/collision hiding

    const me = inner.querySelector(".me");
    if (me) {
      me.style.left = parseFloat(me.dataset.x) * mapScale + "px";
      me.style.top = parseFloat(me.dataset.y) * mapScale + "px";
    }

    if (needsCenter) {
      if (mapCenterImgX === null) {
        mapCenterImgX = lonToSvgX(DEFAULT_MAP_CENTER.lon);
        mapCenterImgY = latToSvgY(DEFAULT_MAP_CENTER.lat);
      }
      centerOn(wrap, mapCenterImgX, mapCenterImgY, mapScale);
    } else if (mapCenterImgX !== null) {
      centerOn(wrap, mapCenterImgX, mapCenterImgY, mapScale);
    }

    updateMapList();
  }

  function saveCamera(wrap) {
    if (!mapScale) return;
    mapCenterImgX = (wrap.scrollLeft + wrap.clientWidth / 2) / mapScale;
    mapCenterImgY = (wrap.scrollTop + wrap.clientHeight / 2) / mapScale;
  }

  function zoomBy(factor) {
    const wrap = document.getElementById("mapwrap");
    if (!wrap) return;
    const centerImgX = (wrap.scrollLeft + wrap.clientWidth / 2) / mapScale;
    const centerImgY = (wrap.scrollTop + wrap.clientHeight / 2) / mapScale;
    mapScale *= factor;
    mapCenterImgX = centerImgX;
    mapCenterImgY = centerImgY;
    applyMapScale();
    centerOn(wrap, centerImgX, centerImgY, mapScale);
  }

  let pinchStartDist = null;
  let pinchStartScale = null;

  function touchDist(t0, t1) {
    return Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
  }

  function attachPinchHandlers(wrap) {
    wrap.addEventListener("scroll", () => {
      saveCamera(wrap);
      // Called straight through rather than via requestAnimationFrame: the
      // visibility pass is a few hundred comparisons and the list only rebuilds
      // when the rows actually change, so rAF bought nothing and stopped
      // updating entirely whenever the page was not being painted.
      updateMapList();
    }, { passive: true });

    wrap.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        pinchStartDist = touchDist(e.touches[0], e.touches[1]);
        pinchStartScale = mapScale;
      }
    }, { passive: true });

    wrap.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2 && pinchStartDist) {
        e.preventDefault();
        const dist = touchDist(e.touches[0], e.touches[1]);
        const factor = dist / pinchStartDist;
        const centerImgX = (wrap.scrollLeft + wrap.clientWidth / 2) / mapScale;
        const centerImgY = (wrap.scrollTop + wrap.clientHeight / 2) / mapScale;
        mapScale = pinchStartScale * factor;
        mapCenterImgX = centerImgX;
        mapCenterImgY = centerImgY;
        applyMapScale();
        centerOn(wrap, centerImgX, centerImgY, mapScale);
      }
    }, { passive: false });

    const endPinch = (e) => {
      if (e.touches.length < 2) {
        pinchStartDist = null;
        pinchStartScale = null;
      }
    };
    wrap.addEventListener("touchend", endPinch, { passive: true });
    wrap.addEventListener("touchcancel", endPinch, { passive: true });
  }

  // Moves the blue dot without rebuilding the page — a re-render on every
  // 20-second fix would throw away the scroll position mid-pan.
  function positionMeDot() {
    const inner = document.getElementById("mapinner");
    if (!inner || !mapScale) return;
    let me = inner.querySelector(".me");
    const x = userLoc ? lonToSvgX(userLoc.lon) : 0;
    const y = userLoc ? latToSvgY(userLoc.lat) : 0;
    const onMap = userLoc && x >= 0 && y >= 0 && x <= ARTBOARD_W && y <= ARTBOARD_H;
    if (!onMap) {
      me?.remove();
      return;
    }
    if (!me) {
      me = document.createElement("div");
      me.className = "me";
      inner.appendChild(me);
    }
    me.dataset.x = x;
    me.dataset.y = y;
    me.style.left = x * mapScale + "px";
    me.style.top = y * mapScale + "px";
  }

  // Failures (permission refused, no fix, off the artboard) are deliberately
  // silent — no status text next to the button.
  function requestFix(recenter) {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        if (!locationOn) return; // toggled off while the fix was in flight
        userLoc = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        positionMeDot();
        // only the initial press moves the map; later fixes must not yank the
        // view out from under someone reading a different part of the city
        if (!recenter) return;
        const x = lonToSvgX(userLoc.lon);
        const y = latToSvgY(userLoc.lat);
        if (x < 0 || y < 0 || x > ARTBOARD_W || y > ARTBOARD_H) return;
        mapCenterImgX = x;
        mapCenterImgY = y;
        const wrap = document.getElementById("mapwrap");
        if (wrap) centerOn(wrap, x, y, mapScale);
      },
      () => {},
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 15000 }
    );
  }

  function startLocationTimer() {
    stopLocationTimer();
    locationTimer = setInterval(() => requestFix(false), LOCATION_INTERVAL_MS);
  }

  function stopLocationTimer() {
    if (locationTimer) clearInterval(locationTimer);
    locationTimer = null;
  }

  function toggleLocation() {
    locationOn = !locationOn;
    if (locationOn) {
      requestFix(true);
      startLocationTimer();
    } else {
      stopLocationTimer();
      userLoc = null;
      positionMeDot();
    }
  }

  // The basemap used to be inlined in this file, which the artifact sandbox
  // required. It no longer is: 2.3MB of vector art that almost never changes
  // does not belong in a page that redeploys whenever the show data moves.
  // Fetched once, parsed once, then cloned in — and cached by the browser
  // across deploys, since map.svg keeps its own ETag.
  let basemapPromise = null;
  let basemapSVG = null;

  // Seen from the air a city is not evenly lit: whole neighbourhoods run
  // brighter or darker than the ones beside them, and a lit stretch is a run
  // of blocks, not a scattering of segments. So the draw is per patch of
  // ground rather than per street — a coarse grid over the map, each cell
  // hashed to a brightness — and every road in a cell agrees with its
  // neighbours. Casings are left alone; they are the shadow under a road, not
  // a road. Done once on the sheet every map is cloned from, so it costs
  // nothing per render.
  const PATCH = 60;                     // ~500m of city per cell

  function lightStreets(svg) {
    for (const p of svg.querySelectorAll("path.st3")) {
      // the group a road sits in is its class. Not the group's subtree: the
      // whole road network sits inside one whose id also says "roads", and
      // reaching for that swept up the casings with everything else.
      const id = p.parentNode.id || "";
      if (id.indexOf("__border") >= 0) continue;          // bloom, not a road
      const d = p.getAttribute("d"), c = d.indexOf(",");
      if (c < 0) continue;
      const cell = Math.floor(+d.slice(1, c) / PATCH) * 977 +
                   Math.floor(parseFloat(d.slice(c + 1)) / PATCH);
      const h = hashId(cell) % 100;
      // A dark neighbourhood dims its side streets, but an artery burns
      // whatever the blocks around it are doing — that is what makes the grid
      // legible from the air at all.
      if (h < 18) p.classList.add("lit");
      else if (h >= 80 && id.indexOf("minor_road") === 0) p.classList.add("dim");
    }
  }

  function loadBasemap() {
    if (!basemapPromise) {
      basemapPromise = fetch("map.svg")
        .then(r => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then(text => {
          const parsed = new DOMParser().parseFromString(text, "image/svg+xml");
          const svg = parsed.documentElement;
          if (!svg || svg.nodeName.toLowerCase() !== "svg") throw new Error("not an svg");
          lightStreets(svg);
          basemapSVG = svg;
          return svg;
        });
    }
    return basemapPromise;
  }

  // Puts the art behind the dots. Safe to call repeatedly; does nothing once
  // the map is already in place.
  function insertBasemap() {
    const inner = document.getElementById("mapinner");
    if (!inner || inner.querySelector("svg")) return;
    if (basemapSVG) {
      inner.prepend(document.importNode(basemapSVG, true));
      applyMapScale();
      return;
    }
    loadBasemap().then(svg => {
      const host = document.getElementById("mapinner");
      if (host && !host.querySelector("svg")) host.prepend(document.importNode(svg, true));
      applyMapScale();
    }).catch(() => {
      // no art, but the dots and the list under the map still work
    });
  }

  // ==================================================================
  // The street, one floor below the listings.
  //
  // Scale comes from the pavement: a Tribeca sidewalk runs ~3.8 m, drawn 24 px,
  // so 6.2 px/m. Every size and speed below is a real quantity through it.
  //
  // Camera 220 m up over 20 m rooftops — six cast-iron storeys. Image
  // motion goes as 1/depth, so the street runs at (220-20)/220 = 0.909 of
  // the roofs and the wall down a gap is 0.1 x its distance off-centre.
  //
  // Deliberately few colours: four roofs, three pavements, two coats and
  // five cars per scene, and no more.
  // ==================================================================

  const PX_PER_M = 6.2;
  const M = (m) => m * PX_PER_M;
  const ROOF_H_M = 20, CAM_H_M = 220;
  const PARALLAX = (CAM_H_M - ROOF_H_M) / CAM_H_M;

  // A Tribeca side street, measured: 12 ft pavements, 8 ft parking either side
  // of an 11 ft lane. Taken from metres so the whole street scales off PX_PER_M.
  //
  // The carriageway and the traffic on it are drawn a quarter over life size
  // against the pavement beside them. A lane in true proportion to a 24px
  // pavement leaves a car thirteen pixels across, which is not enough for it
  // to read as a car; the pavement and the people on it need no such help.
  const ROAD_X = 1.25;
  const MR = (m) => m * PX_PER_M * ROAD_X;
  const WALK_W = Math.round(M(3.8));     // 12 ft
  const PARK_W = Math.round(MR(2.6));    // 8 ft
  const LANE_W = Math.round(MR(3.3));    // 11 ft
  const AV_ROAD = PARK_W + LANE_W;
  // Narrower than the street it shows, so the far side of the driving lane is
  // cropped by the edge of the screen and the listings get the width instead.
  const GUTTER = 38;
  const R = Math.round;              // everything lands on whole pixels
  const PED_R = 4;                   // every person the same size
  const CORNER = PED_R * 2;          // no shopfront closer than this to a corner
  const DOT_D = 11;                  // a gallery on the map: a shade over a person
  const ROAD_W = PARK_W * 2 + LANE_W;    // the cross street shows its full section
  const CROSS_H = WALK_W * 2 + ROAD_W;
  const TILE = 900;

  // The listings are built to the same street: the pavement column beside a
  // roof is GUTTER wide and the gap at a heading is a junction deep. Handing
  // the numbers to CSS rather than repeating them there is what stops the two
  // drifting apart, which they have done twice.
  const rootStyle = document.documentElement.style;
  rootStyle.setProperty("--gutter", GUTTER + "px");
  rootStyle.setProperty("--cross-h", CROSS_H + "px");
  rootStyle.setProperty("--cross-pad", (WALK_W + R((ROAD_W - 26) / 2)) + "px");
  rootStyle.setProperty("--ped-d", PED_R * 2 + "px");
  rootStyle.setProperty("--dot-d", DOT_D + "px");

  // One width for everything. Real vehicles vary by half a metre, but at this
  // scale that is two pixels of difference buying nothing but ragged edges.
  const CAR_W = Math.round(MR(2.1));     // 2.1 m, every vehicle
  // len, then the glass as fractions of it: bonnet before the windscreen,
  // and where the back light starts. A truck has a cargo body instead.
  const VEHICLES = [
    { len: MR(4.6), hood: .26, glass: .13, rear: .72, rearH: .10 },
    { len: MR(4.4), hood: .25, glass: .13, rear: .71, rearH: .10 },
    { len: MR(4.9), hood: .22, glass: .14, rear: .78, rearH: .12 },
    { len: MR(5.4), hood: .14, glass: .13, rear: .86, rearH: .08 },
    { len: MR(7.0), hood: .10, glass: .09, rear: 0,   rearH: 0, body: .24 },
  ];
  const MIX = [0, 0, 0, 1, 1, 2, 2, 3, 4];

  const SCENE = {
    night: {
      // the map, from the same four roofs and the same street
      map: { back: "#26232B", block: "#1F1C25", grid: "#131419",
             line: "#54452F", water: "#000000" },
      glow: [255, 214, 150],
      blank: "#000000", asphalt: "#191A20", avenue: "#131419",
      walks: ["#4A3B2B", "#3E3830", "#54452F"],
      glass: "#0A0908", paint: "#6B6863",
      cars: ["#141312", "#141312", "#2A2724", "#3A3632", "#4A2F2A", "#6B6863"],
      coats: ["#141210", "#241C16"],
      head: [255, 244, 214], tail: [196, 42, 30], gallery: [226, 236, 255],
      // people per 100px of pavement, so a long block carries as many as a
      // tall screen does — the avenue and the side streets fill the same way
      density: { peds: 6.0, crossPeds: 3.0, cars: 6, park: .70,
                 crossCars: 3, crossPark: .50 },
      night: true,
    },
    day: {
      // ground, then the blocks on it, then the street network over both —
      // three tones, because a street the colour of the ground is no street
      map: { back: "#E8E7E7", block: "#DDDCDC", grid: "#B0A49D",
             line: "#6E6E74", water: "#55646B" },   // the Hudson, overcast
      glow: null,
      blank: "#FFFFFF", asphalt: "#3B3A44", avenue: "#6E6E74",
      walks: ["#A89C96", "#A3A0A0", "#B0A49D"],
      glass: "#16151A", paint: "#DDDCDC",
      cars: ["#232323", "#232323", "#DDDCDC", "#B6B2B0", "#8E3B34", "#E8B830"],
      coats: ["#1C1714", "#2A2018"],
      head: null, tail: null, gallery: null,
      // daylight on a weekday afternoon, not an opening: few people about,
      // but the kerb is full — everybody who is here has parked and gone in
      density: { peds: 0.7, crossPeds: 0.7, cars: 2, park: .50,
                 crossCars: 1, crossPark: .40 },
      night: false,
    },
  };

  let cv = null, cx = null, sceneKind = "night", sceneMode = "street";
  let peds = [], avCars = [], avParkA = [], slabs = [], avLights = [], winCol = "#fff";
  let crossStreets = new Map();
  let lastT = -1e9, lastPar = 0, rafId = null, clock = 0;
  // The address bar changes the viewport height on every change of scroll
  // direction, so innerHeight is not a thing to build a scene on: the eye line
  // would slide, and the canvas would be reallocated, while you were simply
  // scrolling. The scene keeps the tallest height it has been and hangs the
  // spare below the fold; only a change of width — a rotation — resets it.
  let sceneH = innerHeight;
  // Whole CSS pixels are up to three device pixels on a phone, so a ground
  // that steps by one of them stutters against roofs the compositor is moving
  // smoothly. Drawing lands on the device grid instead.
  let grid = 1;
  const Q = (v) => Math.round(v * grid) / grid;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[(Math.random() * a.length) | 0];
  const spec = () => VEHICLES[MIX[(Math.random() * MIX.length) | 0]];

  // The window is a hole in the wall with the same light behind it as the
  // spill on the pavement, so it is pitched just above the brightest point
  // that spill reaches — half the beam over the pavement. A flat white was
  // brighter than anything else in the scene by a wide margin.
  function winColour(S) {
    if (!S.gallery) return null;                // daylight: there is no spill
    const w = S.walks.map(toRGB);
    return toHex(S.gallery.map((c, i) => {
      const peak = (c + w.reduce((t, q) => t + q[i], 0) / w.length) / 2;
      return peak + (c - peak) * .25;
    }));
  }

  function geom() {
    const el = document.getElementById("content");
    const r = el ? el.getBoundingClientRect() : { right: Math.min(innerWidth, 640) - 12 };
    const walkX = r.right - GUTTER;
    const roadX = walkX + WALK_W;
    return { walkX, roadX, fieldW: walkX,
             parkA: roadX, lane: roadX + PARK_W,
             edge: roadX + AV_ROAD };        // past here there is nothing
  }

  // Everyone carries how far across the pavement they are and drifts slowly
  // toward a new spot. Two fixed files read as a queue; a wandering offset
  // reads as a crowd, which is what the cross streets already looked like.
  function makeCar(S, y) {
    const v = spec();
    return { y, spec: v, speed: MR(rnd(6.7, 9.4)), color: pick(S.cars), stopped: false };
  }

  // Pavement drifts between its three tones in long even runs broken by short
  // patched stretches — poured slabs, then a piece of pavement someone cut up.
  function buildSlabs(S) {
    slabs = [];
    let y = 0;
    while (y < TILE) {
      const calm = Math.random() < 0.62;
      const end = y + (calm ? rnd(140, 330) : rnd(50, 110));
      const steady = calm ? pick(S.walks) : null;
      while (y < end && y < TILE) {
        const h = calm ? rnd(34, 90) : rnd(12, 28);
        slabs.push({ y, h, c: steady || pick(S.walks) });
        y += h;
      }
    }
  }

  // Lit shopfronts along a building: irregular gaps, and each one as long as
  // whatever is behind the glass. Laid out along one axis for a whole tile or
  // a whole block, so a gallery keeps its frontage instead of flickering.
  function lightRun(span) {
    const out = [];
    for (let a = rnd(0, 120); a < span; ) {
      const len = rnd(16, 84);
      out.push({ a, len });
      a += len + rnd(36, 210);
    }
    return out;
  }

  function parkRow(S, H) {
    const row = [];
    let y = rnd(-80, 20);
    while (y < H + 80) {
      if (Math.random() < S.density.park) { const c = makeCar(S, y); row.push(c); y += c.spec.len + rnd(10, 26); }
      else y += rnd(50, 110);                // hydrant, driveway, or just a space
    }
    return row;
  }

  function populate() {
    const S = SCENE[sceneKind], g = geom(), H = sceneH;

    const walker = (y, dir, hold) => {
      const v = hold ? 0 : M(rnd(1.1, 1.6)), off = rnd(PED_R, WALK_W - PED_R);
      return { axis: "v", x: g.walkX + off, y, off, lane: off, dir, speed: v, base: v,
               r: PED_R, color: pick(S.coats), hold: hold || 0, key: null, side: 0 };
    };
    peds = [];
    for (let i = 0, n = R(H / 100 * S.density.peds); i < n; i++)
      peds.push(walker(rnd(-40, H + 40), Math.random() < .5 ? 1 : -1, 0));
    if (S.night) for (let k = 0; k < 4; k++) {       // knots standing and talking
      const y = rnd(0, H);
      for (let m = 0, n = 2 + ((Math.random() * 3) | 0); m < n; m++)
        peds.push(walker(y + rnd(-7, 7), 0, Infinity));
    }

    avCars = [];
    for (let i = 0; i < S.density.cars; i++) avCars.push(makeCar(S, rnd(-200, H + 200)));
    avParkA = parkRow(S, H);

    crossStreets.clear();
    buildSlabs(S);
    avLights = lightRun(TILE);
    winCol = winColour(S);
  }

  // Each heading keeps its own cross street, keyed by its text so it survives
  // scrolling and re-renders instead of being rebuilt underneath you.
  function crossFor(key, S, W) {
    let c = crossStreets.get(key);
    if (!c) {
      const d = S.density;
      c = { cars: [], parkT: [], parkB: [], occ: null, lights: [] };
      for (let i = 0; i < d.crossCars; i++) c.cars.push({ x: rnd(-200, W), spec: spec(), speed: MR(rnd(6.7, 9.4)), color: pick(S.cars) });
      for (const row of ["parkT", "parkB"]) {
        let x = rnd(-80, 20);
        while (x < W) {
          if (Math.random() < d.crossPark) { const v = spec(); c[row].push({ x, spec: v, color: pick(S.cars) }); x += v.len + rnd(10, 26); }
          else x += rnd(60, 130);
        }
      }
      // one frontage per side of the street, facing the pavement below it
      for (const side of [0, 1]) for (const L of lightRun(W)) c.lights.push({ x: L.a, len: L.len, side });
      // A block only ever filled up when someone walked round the corner onto
      // it, so every street started deserted. It gets its own crowd instead,
      // in the same pool as the avenue's, free to swap between the two.
      for (const side of [0, 1])
        for (let i = 0, n = R(W / 100 * d.crossPeds); i < n; i++) {
          const v = M(rnd(1.1, 1.6)), off = rnd(PED_R, WALK_W - PED_R);
          peds.push({ axis: "h", key, side, off, lane: off,
                      x: rnd(4, W - 4), y: -999, dir: Math.random() < .5 ? 1 : -1,
                      speed: v, base: v, r: PED_R, color: pick(S.coats), hold: 0 });
        }
      crossStreets.set(key, c);
    }
    return c;
  }

  // ---- movement ----------------------------------------------------
  // One population on one pavement network. A walker runs up or down the
  // avenue until it reaches a corner, turns along the cross street's pavement,
  // walks the block, turns back, and rejoins the avenue. Nothing is ever
  // removed and respawned, so the lines of people stay continuous.
  // Nobody walks through anybody. Once everyone has moved, any two people on
  // the same pavement closer than their two widths are pushed apart along the
  // line between them and put back between the kerbs, the whole overlap at
  // once. Feeding it in a fraction at a time to smooth it out does the
  // opposite — it leaves a residue to correct again next frame, and that is a
  // shiver. Avoidance is what steers; this is only the thing that decides.
  //
  // It takes as many passes as it takes: pushing two people apart can push one
  // of them into a third, and against a kerb the correction has nowhere to go
  // and has to come out of the other person instead. Three passes left most
  // frames with somebody a hair inside somebody else. A pass that finds
  // nothing ends it, which is what nearly every frame costs.
  function separate(g) {
    const D = PED_R * 2, lo = PED_R, hi = WALK_W - PED_R;
    // built here rather than reused from the step: somebody who has just
    // turned a corner is on a different pavement than they were a moment ago,
    // and that is exactly when they would land on top of someone
    const lanes = new Map();
    for (const w of peds) {
      const L = lanes.get(bucket(w)); if (L) L.push(w); else lanes.set(bucket(w), [w]);
    }
    for (let pass = 0; pass < 8; pass++) {
      let touched = false;
      for (const L of lanes.values()) {
        // In order along the pavement, so the inner loop stops at the first
        // person out of reach instead of walking the rest of the queue. Every
        // pair used to be looked at; now it is only the ones standing near
        // enough to matter, which is what pays for the extra passes.
        const ax = L[0].axis === "v" ? "y" : "x";
        L.sort((p, q) => p[ax] - q[ax]);
        for (let i = 0; i < L.length; i++)
          for (let j = i + 1; j < L.length; j++) {
            const a = L[i], b = L[j];
            const u = a[ax] - b[ax];             // <= 0: b is further along
            if (-u > D) break;
            const v = a.off - b.off, d = Math.sqrt(u * u + v * v);
            if (d >= D) continue;
            touched = true;
            const k = d > .01 ? (D - d) / (2 * d) : 0;
            const du = d > .01 ? u * k : (i % 2 ? D / 2 : -D / 2), dv = v * k;
            a[ax] += du; b[ax] -= du;
            a.off = Math.min(hi, Math.max(lo, a.off + dv));
            b.off = Math.min(hi, Math.max(lo, b.off - dv));
          }
      }
      if (!touched) break;
    }
    for (const w of peds) if (w.axis === "v") w.x = g.walkX + w.off;
  }

  const bucket = (w) => w.axis === "v" ? "v" : w.key + "/" + w.side;

  function stepWalkers(dt, g, H, boxes) {
    const byKey = new Set(boxes.map(b => b.key));
    // One queue per pavement. Checking everyone against everyone was fine for
    // a single street; with a crowd on every block it is the whole frame.
    const lanes = new Map();
    for (const w of peds) {
      const L = lanes.get(bucket(w)); if (L) L.push(w); else lanes.set(bucket(w), [w]);
    }
    for (const w of peds) {
      if (w.hold === Infinity) continue;

      // Everyone holds a line of their own and comes back to it. Re-picking
      // a target at random meant everyone's average was the middle of the
      // pavement, so that is where they all ended up, on top of each other.
      if (Math.random() < dt * .05) w.lane = rnd(PED_R, WALK_W - PED_R);
      let target = w.lane, limit = w.base, met = null;
      for (const o of lanes.get(bucket(w))) {
        if (o === w) continue;
        const ahead = (w.axis === "v" ? o.y - w.y : o.x - w.x) * w.dir;
        if (ahead < 0 || ahead > 30 || Math.abs(o.off - w.off) > 8) continue;
        if (o.dir === w.dir) limit = Math.min(limit, o.speed * .9);
        else if (!met || ahead < met.ahead) met = { o, ahead };   // the nearest
      }
      if (met) {
        // Pick a side on meeting somebody and hold it, and aim at a fixed
        // point beside them rather than at an offset from wherever you have
        // got to — a target measured from yourself runs away as you follow it,
        // and a side chosen afresh each frame swaps back and forth.
        limit = Math.min(limit, w.base * .6);
        if (!w.dodge) w.dodge = met.o.off > w.off ? -1 : 1;
        target = met.o.off + w.dodge * (PED_R * 2 + 1);
      } else w.dodge = 0;
      w.speed += (limit - w.speed) * Math.min(1, dt * 3);
      target = Math.min(WALK_W - PED_R, Math.max(PED_R, target));
      w.off += Math.max(-9 * dt, Math.min(9 * dt, target - w.off));

      if (w.axis === "v") {
        w.x = g.walkX + w.off;
        w.y += w.dir * w.speed * dt;
        if (w.y < -60) w.y = H + 60;
        if (w.y > H + 60) w.y = -60;
        for (const b of boxes) {                                  // a corner
          const near = w.y > b.top + 3 && w.y < b.top + WALK_W - 3;
          const far = w.y > b.roadBot + 3 && w.y < b.roadBot + WALK_W - 3;
          if ((near || far) && Math.random() < 1.5 * dt) {
            w.axis = "h"; w.dir = -1; w.key = b.key; w.side = near ? 0 : 1;
            w.off = w.lane = Math.min(WALK_W - PED_R, Math.max(PED_R,
                             w.y - (near ? b.top : b.roadBot)));
            break;
          }
        }
      } else {
        if (!byKey.has(w.key)) continue;        // its street is off the screen
        w.x += w.dir * w.speed * dt;
        if (w.dir > 0 && w.x > g.walkX + WALK_W / 2) {            // back at the avenue
          w.axis = "v"; w.key = null;
          w.off = w.lane = rnd(PED_R, WALK_W - PED_R);
          w.dir = Math.random() < .5 ? 1 : -1;
        } else if (w.dir < 0 && w.x < 6) w.dir = 1;
      }
    }
    separate(g);
  }

  // Every cross street currently on screen. The gap is a hole in the roofs,
  // which travel at 1.0, while the ground travels at PARALLAX — so drawing a
  // cross street at its hole's own position pinned it to the roofs and slid it
  // against the avenue. Shifting by the difference puts it back on the ground.
  //
  // Rebuilt once a frame and passed around. It used to be recomputed by each
  // of the five things that needed it, which meant five passes over the DOM
  // and — worse — no guarantee they all saw the same numbers.
  function intersections() {
    const out = [], S = SCENE[sceneKind], W = geom().fieldW;
    for (const el of document.querySelectorAll(".date-head")) {
      const r = el.getBoundingClientRect();
      if (r.bottom < -160 || r.top > sceneH + 160) continue;
      // Zero at the middle of the screen, so a building sits squarely on its
      // own street where you are actually looking. Above and below, the planes
      // separate by the parallax difference and overlap a little — that is
      // what being nearer the camera looks like. No clamp: the clamp is what
      // made the gap stop widening and start dragging the street with it.
      const shift = -(1 - PARALLAX) * (r.top - sceneH / 2);
      const top = r.top + shift;
      const key = el.dataset.key;   // its own, not its words: the gap is empty
      out.push({ el, key, shift, top, st: crossFor(key, S, W),
                 roadTop: top + WALK_W, roadBot: top + WALK_W + ROAD_W, bot: top + CROSS_H });
    }
    return out;
  }

  // Bumper to bumper only at a standstill. Moving traffic keeps roughly
  // three-quarters of a second of headway, so the gap opens as a car speeds
  // up and closes only as it slows to a stop.
  const GAP_STOP = MR(1.4);
  const HEADWAY = 0.75;
  const gapFor = (c) => GAP_STOP + (c.speed || 0) * HEADWAY;

  // A queue on a one-way street: nobody may pass through the car in front, and
  // nobody may enter a junction that is not theirs. Positions are clamped
  // outright rather than nudged by braking, so an overlap is not possible.
  function queue(list, axis, stopLine) {
    const front = (c) => c[axis] + c.spec.len;
    list.sort((a, b) => front(b) - front(a));         // leader first
    for (let i = 0; i < list.length; i++) {
      const c = list[i];
      let cap = stopLine ? stopLine(c) : Infinity;
      // the car in front's tail is simply its own coordinate
      if (i > 0) cap = Math.min(cap, list[i - 1][axis] - gapFor(c));
      if (front(c) > cap) { c[axis] = cap - c.spec.len; c.stopped = true; }
      else c.stopped = false;
    }
  }

  // A real all-way stop: everyone halts at the line, and the box is released
  // to whoever got there first. Nobody moves off until the car occupying the
  // junction is clear of it.
  const STOP_DWELL = 0.4;   // you have to actually stop, not roll through

  // Somebody on the crossing stops the traffic that would drive over them.
  // Only the lane matters — a driver waits for the person in front of the car,
  // not for one still on the far pavement — and only the cross street has a
  // crossing anyone stands on: the avenue's is on the pavement that nobody
  // ever steps off.
  function onCrossing(b) {
    const lane = b.roadTop + PARK_W;
    for (const w of peds)
      if (w.axis === "v" && w.y + PED_R > lane - 2 && w.y - PED_R < lane + CAR_W + 2) return true;
    return false;
  }

  function control(st, b, g) {
    if (st.occ) {
      const c = st.occ.car;
      // clear means past the far crossing, not merely out of the carriageway
      const clear = st.occ.side === "av" ? c.y > b.bot + 2 : c.x > g.edge + 2;
      const gone = st.occ.side === "av" ? !avCars.includes(c) : !st.cars.includes(c);
      // and a car held at the line by people on the crossing is not using the
      // junction, so it gives it up rather than blocking the avenue with it
      const stuck = st.occ.side === "cr" && b.blocked && c.x + c.spec.len < g.walkX - 3;
      if (clear || gone || stuck) st.occ = null; else return;
    }
    let best = null;
    const consider = (car, t, side) => { if (!best || t < best.t) best = { t, side, car }; };
    for (const c of avCars) {
      if (Math.abs((c.y + c.spec.len) - (b.top - 2)) > 2) continue;
      c.waits = c.waits || {};
      if (c.waits[b.key] == null) c.waits[b.key] = clock;
      if (clock - c.waits[b.key] >= STOP_DWELL) consider(c, c.waits[b.key], "av");
    }
    for (const c of st.cars) {
      if (b.blocked) break;                       // it could not go anyway
      if (Math.abs((c.x + c.spec.len) - (g.walkX - 4)) > 2) continue;
      if (c.waitAt == null) c.waitAt = clock;
      if (clock - c.waitAt >= STOP_DWELL) consider(c, c.waitAt, "cr");
    }
    if (best) {
      st.occ = { side: best.side, car: best.car };
      if (best.side === "av") best.car.waits[b.key] = null; else best.car.waitAt = null;
    }
  }

  // Whether a car has committed to a junction is read from where it was
  // before this frame moved it, never from where it is now. A car held at the
  // line sits exactly on it, and the step forward that happens before the
  // queue runs carries it a whole pixel past — at which point it looks
  // committed and is waved through. A pixel used to be more than one frame of
  // travel; at this scale it is not.
  function stepAvenue(dt, g, H, boxes) {
    for (const b of boxes) { b.blocked = onCrossing(b); control(b.st, b, g); }
    const was = new Map(avCars.map(c => [c, c.y + c.spec.len]));
    for (const c of avCars) c.y += c.speed * dt;
    queue(avCars, "y", (c) => {
            let best = Infinity;
            for (const b of boxes) {
              const st = b.st;
              const line = b.top - 2;          // behind the crossing, not on it
              if (was.get(c) > line) continue;             // already at or in the box
              if (st.occ && st.occ.car === c) continue;    // it is this car's turn
              best = Math.min(best, line);
            }
            return best;
          });
    for (const c of avCars) if (c.y > H + 220) c.y = -220 - Math.random() * 200;
  }


  function stepCross(dt, g, boxes) {
    for (const b of boxes) {
      const st = b.st;
      // already on the crossing: finish crossing it rather than stop on it
      const past = new Set(st.cars.filter(c => c.x + c.spec.len > g.walkX - 4));
      for (const c of st.cars) c.x += c.speed * dt;
      queue(st.cars, "x", (c) => past.has(c) ? Infinity
                               : b.blocked || !(st.occ && st.occ.car === c) ? g.walkX - 4
                               : Infinity);
      for (const c of st.cars) if (c.x > g.edge + 40) c.x = -220 - Math.random() * 160;
    }
  }

  // ---- drawing -----------------------------------------------------
  const disc = (x, y, r, c) => { cx.fillStyle = c; cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.fill(); };
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  function beam(x, y, w, h, colour, dir, s) {
    const G = dir === "down"  ? cx.createLinearGradient(0, y, 0, y + h)
            : dir === "up"    ? cx.createLinearGradient(0, y + h, 0, y)
            : dir === "right" ? cx.createLinearGradient(x, 0, x + w, 0)
            :                   cx.createLinearGradient(x + w, 0, x, 0);
    G.addColorStop(0, rgba(colour, s));
    G.addColorStop(1, rgba(colour, 0));
    cx.fillStyle = G; cx.fillRect(x, y, w, h);
  }

  // The two directions were the same routine with the axes swapped. One
  // function, and a flag that decides which way the rectangle is laid down.
  function veh(at, front, sp, colour, glass, down) {
    const L = sp.len;
    // Not rounded: snapping a moving rectangle to whole pixels every frame is
    // what made the traffic and the people step rather than glide, and rounding
    // position and length apart left a hairline flickering at the tail.
    const box = (a, b) => down ? cx.fillRect(at, a, CAR_W, b)
                               : cx.fillRect(a, at, b, CAR_W);
    cx.fillStyle = colour; box(front - L, L);
    if (sp.body) { cx.fillStyle = SCENE[sceneKind].cars[2]; box(front - L, L * (1 - sp.body)); }
    cx.fillStyle = glass;
    box(front - L * (sp.hood + sp.glass), L * sp.glass);
    if (sp.rear) box(front - L * (sp.rear + sp.rearH), L * sp.rearH);
  }

  // A cross street is the same section as the avenue at fixed offsets from the
  // top of its band: pavement, parking, lane, parking, pavement. A junction is
  // one piece of ground, so it is drawn in layers across both streets at once
  // rather than each street painting over the other — that is what stops the
  // horizontal street burying the traffic passing under it.
  function drawCrossSurface(g, b, S) {
    const bl = R(g.walkX), thru = R(g.edge);
    const top = Q(b.top), roadTop = Q(b.roadTop), roadBot = Q(b.roadBot);
    cx.fillStyle = S.avenue; cx.fillRect(0, roadTop, thru, ROAD_W);
    cx.save();
    cx.beginPath(); cx.rect(0, top, bl, CROSS_H); cx.clip();
    for (const s of slabs) {
      cx.fillStyle = s.c;
      const sx = R(s.y - 40), sw = R(s.h) + 1;
      cx.fillRect(sx, top, sw, WALK_W);
      cx.fillRect(sx, roadBot, sw, WALK_W);
    }
    cx.restore();
  }

  // Bar and gap the same width with a gap at each end, so the pattern never
  // runs into the kerb: n bars and n+1 gaps means the unit is span / (2n + 1),
  // with n chosen to land it nearest 8px for whatever is being crossed.
  function zebra(x, y, across, along, barsRunDown, colour) {
    const n = Math.max(2, Math.round((across / 8 - 1) / 2));
    const unit = across / (2 * n + 1);
    cx.fillStyle = colour;
    for (let i = 0; i < n; i++) {
      const o = unit * (1 + 2 * i);
      if (barsRunDown) cx.fillRect(R(x + o), Q(y), R(unit), R(along));
      else cx.fillRect(R(x), Q(y + o), R(along), Q(unit));
    }
  }

  // A crossing is the pavement carried across the road, so it sits exactly
  // where the pavement is — not alongside it. Crossing the cross street means
  // standing in the avenue's pavement column; crossing the avenue means
  // standing in one of the cross street's pavements.
  function drawCrossPaint(g, b, S) {
    zebra(g.walkX, b.roadTop, ROAD_W, WALK_W, false, S.paint);
    const av = g.edge - g.roadX;                   // the avenue, kerb to kerb
    zebra(g.roadX, b.top, av, WALK_W, true, S.paint);
    zebra(g.roadX, b.roadBot, av, WALK_W, true, S.paint);
  }

  function draw(par, boxes) {
    const S = SCENE[sceneKind], W = innerWidth, H = sceneH;

    if (sceneMode === "clouds") {
      cx.fillStyle = S.map.back; cx.fillRect(0, 0, W, H);
      drawMapGlow(S);
      return;
    }

    const g = geom();

    // 1 — surfaces
    cx.fillStyle = S.blank; cx.fillRect(0, 0, W, H);      // nothing past the kerb
    cx.fillStyle = S.asphalt; cx.fillRect(0, 0, R(g.fieldW), H);
    cx.fillStyle = S.avenue; cx.fillRect(R(g.roadX), 0, R(g.edge) - R(g.roadX), H);
    const off = ((par % TILE) + TILE) % TILE;
    for (let t = -TILE; t < H + TILE; t += TILE) {
      const base = t - off;
      for (const s of slabs) { cx.fillStyle = s.c; cx.fillRect(R(g.walkX), Q(base + s.y), WALK_W, R(s.h) + 1); }
    }
    for (const b of boxes) drawCrossSurface(g, b, S);
    for (const b of boxes) {                       // pavement stops at a junction
      cx.fillStyle = S.avenue;
      cx.fillRect(R(g.walkX), Q(b.roadTop), WALK_W, ROAD_W);
    }

    // 2 — paint, before anything drives over it
    for (const b of boxes) drawCrossPaint(g, b, S);

    // 3 — light, before any traffic, so no beam lands on a car
    if (S.night) {
      for (let t = -TILE; t < H + TILE; t += TILE) {      // frontage on the avenue
        const base = t - off;
        for (const L of avLights) {
          const y = Q(base + L.a), len = R(L.len);
          if (y > H || y + len < 0) continue;
          if (boxes.some(b => y + len > b.top - CORNER && y < b.bot + CORNER)) continue;
          beam(R(g.walkX), y, WALK_W, len, S.gallery, "right", .5);
        }
      }
      for (const b of boxes) for (const L of b.st.lights) {  // and on the block
        const x = R(L.x), len = Math.min(R(L.len), R(g.walkX) - CORNER - x);
        if (len <= 0) continue;
        if (L.side) beam(x, Q(b.roadBot), len, WALK_W, S.gallery, "up", .5);
        else        beam(x, Q(b.top), len, WALK_W, S.gallery, "down", .5);
      }
      for (const c of avCars) {                     // start 2px inside the car
        beam(R(g.lane), c.y + c.spec.len - 2, CAR_W, 54, S.head, "down", .5);
        beam(R(g.lane), c.y - 28, CAR_W, 30, S.tail, "up", .38);
      }
      for (const b of boxes) {
        const st = b.st;
        const laneY = Q(b.roadTop) + PARK_W;
        for (const c of st.cars) {
          beam(c.x + c.spec.len - 2, laneY, 46, CAR_W, S.head, "right", .5);
          beam(c.x - 24, laneY, 26, CAR_W, S.tail, "left", .32);
        }
      }
    }

    // 3b — the shopfront. Off the centre of the screen the roofs and the
    // ground have pulled apart, and a strip of the building's own wall shows in
    // the gap. The lit window sits on it, hard against the pavement and on top
    // of whatever light it is throwing, and grows as the perspective opens.
    cx.fillStyle = winCol;
    for (const b of winCol ? boxes : []) {
      const wall = Math.min(Math.abs(b.shift), 9);
      if (wall < 1) continue;
      const above = b.shift > 0;                  // which building is showing
      const y = above ? Q(b.top) - wall : Q(b.bot);
      for (const L of b.st.lights) {
        if (L.side !== (above ? 0 : 1)) continue;
        const x = R(L.x), len = Math.min(R(L.len), R(g.walkX) - CORNER - x);
        if (len > 0) cx.fillRect(x, y, len, wall);
      }
    }

    // 4 — parked. Nobody parks in a junction or on a crossing.
    const blockedV = (y, len) => boxes.some(b => y + len > b.top && y < b.bot);
    for (const p of avParkA) if (!blockedV(p.y, p.spec.len)) veh(R(g.parkA), p.y + p.spec.len, p.spec, p.color, S.glass, true);
    for (const b of boxes) {
      const st = b.st;
      const stop = g.walkX - 6;
      for (const p of st.parkT) if (p.x + p.spec.len < stop) veh(Q(b.roadTop), p.x + p.spec.len, p.spec, p.color, S.glass, false);
      for (const p of st.parkB) if (p.x + p.spec.len < stop) veh(Q(b.roadBot) - PARK_W, p.x + p.spec.len, p.spec, p.color, S.glass, false);
    }

    // 5 — everything moving, both directions on the same layer
    for (const c of avCars) veh(R(g.lane), c.y + c.spec.len, c.spec, c.color, S.glass, true);
    for (const b of boxes) {
      const st = b.st;
      const laneY = Q(b.roadTop) + PARK_W;
      for (const c of st.cars) veh(laneY, c.x + c.spec.len, c.spec, c.color, S.glass, false);
    }

    // 6 — people. Someone on a block is held against their own street rather
    // than against the screen, so they keep their pavement as the page scrolls
    // under them. Done here, not in the step, so a frame drawn without one —
    // a plain scroll — puts them in the right place too.
    for (const w of peds) if (w.axis === "h") {
      const b = boxes.find(x => x.key === w.key);
      w.y = b ? (w.side ? b.roadBot : b.top) + w.off : -999;
    }
    for (const p of peds) if (p.y > -20) disc(p.x, p.y, p.r, p.color);

    // 7 — the crop. Past the kerb there is nothing, so a car or a headlight
    // that overshoots is cut off at the line instead of floating in the blank.
    // Cross traffic is allowed to run well past it before it wraps, which is
    // what stops a car vanishing whole a length short of the edge.
    cx.fillStyle = S.blank; cx.fillRect(R(g.edge), 0, W - R(g.edge), H);
  }

  // Everything on the ground is held in screen coordinates on a canvas that
  // does not scroll, so a scroll has to carry it the other way. Both of the
  // paths that draw have to do it. The surfaces are painted straight from the
  // offset, so a fallback draw that moved them without carrying the traffic
  // left the next animated frame to do the whole gap at once — and the street
  // lurched under the roofs. That is the path a phone takes, because frames
  // are throttled during a flick and the fallback is what runs.
  function carry(par) {
    const d = par - lastPar;
    lastPar = par;
    if (!d || sceneMode !== "street") return;
    for (const w of peds) w.y -= d;
    for (const c of avCars) c.y -= d;
    for (const p of avParkA) {
      p.y -= d;
      if (p.y < -200) p.y += sceneH + 400;
      if (p.y > sceneH + 200) p.y -= sceneH + 400;
    }
  }

  function frame(t) {
    rafId = requestAnimationFrame(frame);
    const par = scrollY * PARALLAX;
