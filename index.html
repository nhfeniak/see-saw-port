<!doctype html>
<html lang="en" data-scene="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>See Saw Port</title>
<style>
  /* ------------------------------------------------------------------
     Tribeca from above. Two scenes, set per page on <html data-scene>:
       night  — Openings. An opening reception after dark.
       day    — On View. Satellite daylight.
     Roof, asphalt and shadow colours are sampled from aerial photographs
     of Tribeca, not invented. The one rule they follow that matters:
     lit surfaces run warm, shadowed surfaces run cool/blue. Flat grey
     in both directions is what makes fake aerials look fake.
     Shapes are rectangles and circles only. No gradients, no transparency:
     everything is a flat block of one colour.
     ------------------------------------------------------------------ */

  :root[data-scene="day"] {
    --void:        #9C918C;   /* open ground, sunlit */
    --asphalt:     #8C7F78;   /* avenue, in sun */
    --asphalt-sh:  #4A4550;   /* between buildings — they shade their own gap */
    --walk:        #A89C96;   /* sidewalk concrete */
    --curb:        #B6ADA6;
    --paint:       #E4E0DA;   /* lane paint */
    --paint-y:     #D2A93C;
    --ink:         #141319;
    --paint-ink:   #E4E0DA;
    --head-ink:    #141319;   /* dark: the heading sits on sunlit asphalt */
    --chrome:      #E8E7E7;   /* same stock as a white-membrane roof */
    --chrome2:     #D2CFCA;
    --plate:       #EDEBE6;
    --plate-ink:   #141319;
    --chrome-ink:  #141319;
    --manhole:     #6E6763;
    --umbrella:    #2F5FC4;
    --line:        #141319;
    --bookmark:    #FFD91A;
    --location:    #1E5FD8;
  }

  :root[data-scene="night"] {
    --void:        #0C0A0A;
    --asphalt:     #3B2C1E;   /* under a lamp */
    --asphalt-sh:  #221C16;   /* the gaps, away from the lamps */
    --walk:        #5E4A32;
    --curb:        #6B5842;
    --paint:       #BFB8A6;
    --paint-y:     #C9A13A;
    --ink:         #F0EDE6;
    --paint-ink:   #D9C28C;
    --head-ink:    #D9C28C;
    --chrome:      #26232B;   /* same stock as the palest night roof */
    --chrome2:     #35313C;
    --plate:       #2A2730;
    --plate-ink:   #F0EDE6;
    --chrome-ink:  #F0EDE6;
    --manhole:     #2C2620;
    --umbrella:    #2F5FC4;
    --line:        #F0EDE6;
    --bookmark:    #FFD91A;
    --location:    #1E5FD8;
  }

  * {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -moz-text-size-adjust: none;
  }

  html { background: var(--void); }

  body {
    margin: 0;
    background: none;
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    line-height: 1.4;
    padding: 12px;
    max-width: 640px;
  }

  /* the street lives on a fixed canvas behind everything; roofs are opaque
     DOM on top of it, so you only see down in the gaps they leave */
  #scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    display: block;
  }

  body > * { position: relative; z-index: 1; }

  a { color: inherit; }

  /* One box across the top for everything, built like a listing's roof —
     no rules, no plates, nothing dividing it. */
  .meta, nav.top, .tabs {
    background: var(--chrome);
    color: var(--chrome-ink);
    border: none;
    margin: 0;
    padding: 4px 11px;
  }

  .meta { padding-top: 9px; }

  nav.top {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 14px;
  }

  nav.top:last-of-type { padding-bottom: 10px; }

  nav.top a { text-decoration: underline; cursor: pointer; font-weight: bold; }
  nav.top a.active { text-decoration: none; }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 12px;
    padding-bottom: 10px;
  }

  .tabs a { text-decoration: underline; cursor: pointer; }
  .tabs a.active { text-decoration: none; font-weight: bold; }

  /* ---- a date / neighbourhood heading gets its own roof ---- */
  /* A heading is the gap between two blocks. The walls showing in it are
     sized in script from how far off-centre the gap is — straight below the
     camera you see no wall at all, at the edge of the screen you see 41px of
     it, so they breathe open and shut as you scroll. */
  .date-head {
    position: relative;
    box-sizing: border-box;
    height: 126px;          /* pavement, parking, lane, parking, pavement */
    display: flex;
    align-items: flex-start;
    margin: 0;
    padding: 48px 11px 0;   /* puts the words in the carriageway */
    background: none;
    color: var(--head-ink);
    font-weight: bold;
    font-size: 22px;
  }

  .date-head > span { position: relative; z-index: 1; }

  .date-head .daymap-link {
    font-size: 14px;
    font-weight: normal;
    text-decoration: underline;
    cursor: pointer;
  }

  .entries { display: block; }
  .maplist { margin-top: 0; }

  /* under the map there is no city to stand on — the listings sit on cloud */
  .maplist .entry-main {
    background: none;
    color: var(--plate-ink);
  }

  /* ---- one building per listing ----------------------------------
     column 1 is the roof, column 2 is the pavement beside it where the
     bookmark sits; the row underneath is the gap you see down through. */
  .entry {
    display: grid;
    /* the second column IS the street; keep it equal to GUTTER in script */
    grid-template-columns: 1fr 96px;
  }

  /* one building, one flat colour, as tall as its own text needs */
  .entry-main {
    grid-column: 1;
    grid-row: 1;
    min-width: 0;
    background: var(--roof);
    color: var(--roof-ink);
    padding: 9px 11px 10px;
  }

  .entry .title {
    display: block;
    font-size: 14px;
    line-height: 1.4;
    font-weight: bold;
    text-decoration: none;
  }

  .entry .sub { display: block; font-size: 14px; line-height: 1.4; }
  .entry .addr-link { text-decoration: none; }

  .entry .summary { font-style: italic; }

  /* ---- bookmark: a plate in the pavement, and an umbrella over it ---- */
  .bm {
    grid-column: 2;
    grid-row: 1;
    align-self: center;
    justify-self: start;   /* sits on the pavement, not out in the road */
    width: 34px;
    height: 34px;
    padding: 0;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bm::after {
    content: "";
    box-sizing: border-box;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--manhole);
  }

  .bm.on::after {
    width: 25px;
    height: 25px;
    background: var(--umbrella);
  }

  .empty { padding: 10px 11px; background: var(--chrome); color: var(--chrome-ink); }

  /* ---- maps ---- */
  .map-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    padding: 10px 11px;
    background: var(--chrome);
  }

  .map-controls button {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    font-weight: bold;
    color: var(--chrome-ink);
    background: var(--chrome2);
    border: none;
    width: 32px;
    height: 32px;
    cursor: pointer;
  }

  .map-controls button.loc::after {
    content: "";
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--location);
  }

  /* the opening in the cloud is inset, so the glow has somewhere to fall */
  .mapframe { position: relative; padding: 30px 22px; }

  .mapwrap {
    max-height: 70vh;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }

  .mapinner { position: relative; }
  .mapinner svg { display: block; max-width: none; }

  /* the basemap carries its own greys; repaint them to match the scene.
     #mapinner beats the <style> inside the SVG on specificity. */
  :root[data-scene="night"] #mapinner .st0 { fill: #0C0A0A; }
  :root[data-scene="night"] #mapinner .st1 { fill: #191519; }
  :root[data-scene="night"] #mapinner .st2 { opacity: 1; fill: #191519; }
  :root[data-scene="night"] #mapinner .st3 { stroke: #7A5423; }
  :root[data-scene="day"]   #mapinner .st0 { fill: #CFC9C4; }
  :root[data-scene="day"]   #mapinner .st1 { fill: #DED8D3; }
  :root[data-scene="day"]   #mapinner .st2 { opacity: 1; fill: #DED8D3; }
  :root[data-scene="day"]   #mapinner .st3 { stroke: #9A938C; }

  /* The rivers are the only paths in the basemap carrying no class, so they
     kept their default black and read as holes once the land went light. */
  :root[data-scene="night"] #mapinner path:not([class]) { fill: #08090C; }
  :root[data-scene="day"]   #mapinner path:not([class]) { fill: #6B7A82; }

  .dot {
    position: absolute;
    width: 30px;
    height: 30px;
    margin: -15px 0 0 -15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dot::after {
    content: "";
    box-sizing: border-box;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--dot-face);
  }

  :root[data-scene="night"] { --dot-face: #F0EDE6; --dot-edge: #F0EDE6; }
  :root[data-scene="day"]   { --dot-face: #000000; --dot-edge: #000000; }

  /* bookmarked reads yellow on the map, as before */
  .dot.on::after { background: var(--bookmark); }

  .me {
    position: absolute;
    width: 15px;
    height: 15px;
    margin: -7.5px 0 0 -7.5px;
    border-radius: 50%;
    background: var(--location);
    pointer-events: none;
  }

  .dot-label {
    position: absolute;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--map-label);
    white-space: nowrap;
    pointer-events: none;
  }

  :root[data-scene="night"] { --map-label: #F0EDE6; }
  :root[data-scene="day"]   { --map-label: #000000; }

  @media (prefers-reduced-motion: reduce) {
    /* the scene still draws, it just stops moving */
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="meta" id="updated">loading...</div>
<nav class="top" id="topnav"></nav>

<div id="content">loading...</div>

<script>
  const NYC_TZ = "America/New_York";
  const HAMPTONS = "hamptons";
  const DEFAULT_MAP_CENTER = { lat: 40.718, lon: -74.001 }; // lower Manhattan

  // The traced basemap does not sit quite where the coordinates put it, so dots
  // drifted off their buildings. These two numbers are an eyeballed nudge, not a
  // survey: they were arrived at by looking at downtown at deep zoom and saying
  // "about the gap between those two galleries, that way" — the gallery pairs
  // were a convenient ruler, nothing more. So treat them as approximate, and
  // safe to re-tune by eye.
  //
  // Applied to the projection rather than by nudging the basemap: moving the art
  // leaves an uncovered strip at the edges, and the artboard crop is deliberate.
  // Both are under a pixel and a half — invisible until the deep zoom levels,
  // where they amount to most of a block. Only checked downtown, so if the art
  // is also rotated or scaled this will drift further out.
  const PLOT_DX = -1.2866;
  const PLOT_DY = -0.9131;
  let userLoc = null; // {lat, lon} once the browser gives us a fix
  let locationOn = false;
  let locationTimer = null;
  const LOCATION_INTERVAL_MS = 20000;

  // vector basemap artboard: viewBox 0 0 1040 1665.9, corners given as lat/long
  const ARTBOARD_W = 1040;
  const ARTBOARD_H = 1665.9;
  const ARTBOARD_LAT_MAX = 40 + 51 / 60 + 30.7 / 3600;   // top-left    40°51'30.7"N
  const ARTBOARD_LON_MIN = -(74 + 3 / 60 + 22.5 / 3600); // top-left    74°03'22.5"W
  const ARTBOARD_LAT_MIN = 40 + 38 / 60 + 31.8 / 3600;   // bottom-right 40°38'31.8"N
  const ARTBOARD_LON_MAX = -(73 + 52 / 60 + 38.1 / 3600);// bottom-right 73°52'38.1"W

  let latestShows = null;
  let bookmarks = new Set();
  let onViewNeighborhood = null; // null = All
  // Rows pinned to the top of the map list. A show joins when bookmarked and
  // never leaves until the page is reloaded, so un-bookmarking by mistake does
  // not reorder the row out from under the tap.
  let stickyTop = new Set();
  let mapPoints = [];    // what is plotted in the current map view
  let mapKind = null;    // "opening" | "onview"
  let mapListSig = "";   // last rendered row order, to skip redundant repaints
  let currentPage = "opening";
  let openingMapDate = null; // NYC date-key ("YYYY-MM-DD") of the selected day subtab

  // shared "camera" state for every map view (Openings Map + On View Map share
  // one camera so switching tabs/subtabs keeps you looking at the same spot)
  let mapScale = null;
  let mapCenterImgX = null;
  let mapCenterImgY = null;

  const PAGES = [
    { id: "opening", label: "Openings" },
    { id: "onview", label: "On View" },
    { id: "opening-map", label: "Openings Map" },
    { id: "onview-map", label: "On View Map" },
  ];

  function fmtUpdated(iso) {
    if (!iso) return "no data yet";
    const d = new Date(iso);
    return "Updated " + new Intl.DateTimeFormat("en-US", {
      timeZone: NYC_TZ, month: "short", day: "numeric",
      hour: "numeric", minute: "2-digit"
    }).format(d);
  }

  // Bookmarks are per-device: localStorage only, never sent anywhere. A show
  // starred on the laptop is NOT starred on the phone.
  function applyBookmarkStyles() {
    document.querySelectorAll(".bm[data-id]").forEach(b => {
      const on = bookmarks.has(b.dataset.id);
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    document.querySelectorAll(".dot[data-id]").forEach(d => {
      d.classList.toggle("on", bookmarks.has(d.dataset.id));
    });
  }

  const BOOKMARK_KEY = "seesawport.bookmarks";

  // Which tab and sub-tab you were on, so a reload puts you back. Deliberately
  // sessionStorage, not local: reloading mid-visit should not lose your place,
  // but opening the app fresh tomorrow should start at Openings rather than on
  // some stale day's map. Note this does NOT preserve the pinned bookmark rows
  // — clearing those is exactly what a reload is for.
  const VIEW_KEY = "seesawport.view";

  function saveView() {
    try {
      sessionStorage.setItem(VIEW_KEY, JSON.stringify({
        page: currentPage,
        nbhd: onViewNeighborhood,
        day: openingMapDate,
      }));
    } catch (e) {
      // storage unavailable — the app just always opens on Openings
    }
  }

  function restoreView() {
    let saved = null;
    try {
      saved = JSON.parse(sessionStorage.getItem(VIEW_KEY) || "null");
    } catch (e) {
      return;
    }
    if (!saved) return;
    // Validate rather than trust: a stored page id could be from an older
    // build, and the stored day/neighborhood may no longer exist in the data.
    // Both of those are re-checked at render, which falls back cleanly.
    if (PAGES.some(p => p.id === saved.page)) currentPage = saved.page;
    if (saved.nbhd === null || typeof saved.nbhd === "string") onViewNeighborhood = saved.nbhd;
    if (saved.day === null || typeof saved.day === "string") openingMapDate = saved.day;
  }

  function loadBookmarks() {
    try {
      const raw = localStorage.getItem(BOOKMARK_KEY);
      bookmarks = new Set(raw ? JSON.parse(raw).map(String) : []);
    } catch (e) {
      bookmarks = new Set(); // private window, blocked storage, corrupt value
    }
    stickyTop = new Set(bookmarks);
  }

  function toggleBookmark(id) {
    const key = String(id);
    if (bookmarks.has(key)) {
      bookmarks.delete(key); // stays pinned — stickyTop is not touched here
    } else {
      bookmarks.add(key);
      stickyTop.add(key);
    }
    applyBookmarkStyles();
    updateMapList();
    try {
      localStorage.setItem(BOOKMARK_KEY, JSON.stringify([...bookmarks]));
    } catch (e) {
      // storage unavailable — the toggle still works for this visit
    }
  }

  // GitHub's scheduler will not fire for this repo, so the refresh is manual:
  // the link opens the workflow's own page, where "Run workflow" starts it.
  // Data appears here a couple of minutes later, once Pages rebuilds.
  const REFRESH_URL = "https://github.com/nhfeniak/see-saw-port/actions/workflows/refresh.yml";

  function renderUpdatedLine() {
    const el = document.getElementById("updated");
    if (!el) return;
    el.textContent = fmtUpdated(latestShows ? latestShows.fetched_at : null) + " ";
    const a = document.createElement("a");
    a.href = REFRESH_URL;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "Refresh";
    el.appendChild(a);
  }

  function dateOnly(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  function todayNYC() {
    const parts = new Intl.DateTimeFormat("en-CA", { timeZone: NYC_TZ }).format(new Date());
    const [y, m, d] = parts.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  function nycDateKey(isoNoZone) {
    const d = new Date(isoNoZone + "Z");
    return new Intl.DateTimeFormat("en-CA", { timeZone: NYC_TZ }).format(d);
  }

  // The openings list rolls over at 9am NYC, matching the morning refresh —
  // so tonight's 6pm reception still shows for the rest of tonight, rather
  // than dropping off the moment it starts.
  function openingsCutoffKey() {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: NYC_TZ, year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", hourCycle: "h23"
    }).formatToParts(new Date());
    const get = t => parts.find(p => p.type === t).value;
    const d = new Date(Number(get("year")), Number(get("month")) - 1, Number(get("day")));
    if (Number(get("hour")) < 9) d.setDate(d.getDate() - 1);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function fmtDateHeading(dateKey) {
    const [y, m, d] = dateKey.split("-").map(Number);
    const dateObj = new Date(y, m - 1, d);
    return new Intl.DateTimeFormat("en-US", { weekday: "short", month: "short", day: "numeric" }).format(dateObj);
  }

  function capWords(s) {
    return (s || "").replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1));
  }

  function escapeHTML(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function isHamptons(show) {
    return (show.neighborhood || "").toLowerCase() === HAMPTONS;
  }

  function directionsLink(show) {
    if (show.address1) {
      const q = [show.address1, "New York, NY"].filter(Boolean).join(", ");
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
    }
    if (show.latitude && show.longitude) {
      return `https://www.google.com/maps/search/?api=1&query=${show.latitude},${show.longitude}`;
    }
    return null;
  }

  function addressOnly(show) {
    if (!show.address1) return "";
    return show.address1 + (show.address2 ? ", " + show.address2 : "");
  }

  // Roof colours, sampled from the aerials, in roughly the proportions the
  // photographs show: mostly pale membrane, a solid minority of dark EPDM,
  // and a few accents. Assigned by a hash of the show id so a building keeps
  // its roof between renders instead of flickering on every repaint.
  const ROOFS = {
    day:   [["#E8E7E7", 34], ["#C5B9B6", 26], ["#6B6460", 18], ["#4F4650", 22]],
    night: [["#131218", 30], ["#191720", 28], ["#1F1C25", 24], ["#26232B", 18]],
  };
  const INK_DARK = "#141319", INK_LIGHT = "#F0EDE6";

  function relLum(hex) {
    const n = parseInt(hex.slice(1), 16);
    const f = c => (c /= 255) <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    return 0.2126 * f(n >> 16 & 255) + 0.7152 * f(n >> 8 & 255) + 0.0722 * f(n & 255);
  }
  const contrast = (a, b) => {
    const [x, y] = [relLum(a), relLum(b)].sort((m, n) => n - m);
    return (x + 0.05) / (y + 0.05);
  };

  function hashId(id) {
    let x = 2166136261;
    const s = String(id);
    for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); }
    return (x >>> 0);
  }

  function roofFor(show) {
    const table = ROOFS[sceneKind] || ROOFS.night;
    const hash = hashId(show.id);
    let n = hash % 100, roof = table[0][0];
    for (const [hex, w] of table) { if (n < w) { roof = hex; break; } n -= w; }
    // whichever ink reads better on that roof, rather than a fixed threshold —
    // the mid greys sit right where a threshold picks the wrong one
    const ink = contrast(roof, INK_DARK) >= contrast(roof, INK_LIGHT) ? INK_DARK : INK_LIGHT;
    return { roof, ink };
  }

  function entryHTML(show) {
    const titleText = show.title || show.headline || show.name;
    const combinedTitle = show.artist ? `${show.artist} – ${titleText}` : titleText;
    const dl = directionsLink(show);
    const addr = addressOnly(show);
    const galleryName = escapeHTML(show.name);
    // the gallery name links to its Instagram where we have one, since that is
    // where galleries actually post; otherwise to the website from the feed
    const galleryHref = show.instagram
      ? `https://www.instagram.com/${show.instagram}/`
      : (show.url || "");
    const galleryLinked = galleryHref
      ? `<a class="addr-link" href="${escapeHTML(galleryHref)}" target="_blank" rel="noopener">${galleryName}</a>`
      : galleryName;
    const galleryLine = (dl && addr)
      ? `${galleryLinked}, <a class="addr-link" href="${dl}" target="_blank" rel="noopener">${escapeHTML(addr)}</a>`
      : galleryLinked + (addr ? `, ${escapeHTML(addr)}` : "");
    const sk = roofFor(show);
    return `
      <div class="entry" style="--roof:${sk.roof};--roof-ink:${sk.ink}">
        <div class="entry-main">
          <a class="title" href="${escapeHTML(show.share_url || "")}" target="_blank" rel="noopener">${escapeHTML(combinedTitle)}</a>
          <div class="sub">${galleryLine}</div>
          ${show.summary ? `<div class="sub summary">${escapeHTML(show.summary)}</div>` : ""}
        </div>
        <button class="bm" type="button" data-id="${show.id}" aria-pressed="false" aria-label="Bookmark this show"></button>
      </div>`;
  }

  function groupByKey(items, keyFn, sortFn) {
    const map = new Map();
    for (const it of items) {
      const k = keyFn(it);
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(it);
    }
    return [...map.entries()].sort(sortFn || ((a, b) => a[0].localeCompare(b[0])));
  }

  // fixed display order, Manhattan first then out of it
  const NEIGHBORHOOD_ORDER = ["downtown", "chelsea", "uptown", "brooklyn", "hamptons"];

  function neighborhoodRank(n) {
    const i = NEIGHBORHOOD_ORDER.indexOf((n || "").toLowerCase());
    return i === -1 ? NEIGHBORHOOD_ORDER.length : i;
  }

  // Every list runs north to south. Manhattan used to run the other way, which
  // meant Brooklyn and the Hamptons needed an exception; with one direction
  // throughout, the exception is gone.

  // In the list views a bookmarked show rises to the top of the section it is
  // already in — its date, or its neighborhood — not to the top of the page.
  // Order within each half is left alone, so both still run north to south.
  function bookmarkedFirst(items) {
    const marked = [];
    const rest = [];
    for (const s of items) {
      (bookmarks.has(String(s.id)) ? marked : rest).push(s);
    }
    return marked.concat(rest);
  }

  function sortByLatitude(items) {
    return items.slice().sort((a, b) => b.latitude - a.latitude);
  }

  function renderGroupedByDate(groups) {
    return groups.map(([dateKey, items]) => `
      <div class="date-head"><span>${fmtDateHeading(dateKey)} <a class="daymap-link" data-date="${dateKey}">Map</a></span></div>
      <div class="entries">${items.map(entryHTML).join("")}</div>
    `).join("");
  }

  function computeLists(shows) {
    const today = todayNYC();

    const cutoffKey = openingsCutoffKey();
    const openingSoon = shows
      .filter(s => s.opening_start_time && !isHamptons(s))
      .filter(s => nycDateKey(s.opening_start_time) >= cutoffKey)
      .sort((a, b) => a.opening_start_time.localeCompare(b.opening_start_time));

    const onView = shows
      .filter(s => s.starts && s.ends && s.starts <= s.ends)
      .filter(s => dateOnly(s.starts) <= today && dateOnly(s.ends) >= today)
      .sort((a, b) => a.ends.localeCompare(b.ends));

    return { openingSoon, onView };
  }

  // north to south, with Brooklyn kept together at the end
  function geoSort(items) {
    return items.slice().sort((a, b) => {
      const aBk = (a.neighborhood || "").toLowerCase() === "brooklyn";
      const bBk = (b.neighborhood || "").toLowerCase() === "brooklyn";
      if (aBk !== bBk) return aBk ? 1 : -1;
      return b.latitude - a.latitude;
    });
  }

  function renderOpeningPage() {
    if (!latestShows) return `<div class="empty">no data yet</div>`;
    const { openingSoon } = computeLists(latestShows.shows);
    if (!openingSoon.length) return `<div class="empty">nothing upcoming</div>`;
    const groups = groupByKey(openingSoon, s => nycDateKey(s.opening_start_time))
      .map(([dateKey, items]) => [dateKey, bookmarkedFirst(geoSort(items))]);
    return renderGroupedByDate(groups);
  }

  function renderOnViewPage() {
    if (!latestShows) return `<div class="empty">no data yet</div>`;
    const { onView } = computeLists(latestShows.shows);

    // Sub-tabs in the same style as the openings map's date tabs. "All" leaves
    // out the Hamptons, which are a drive away and only wanted deliberately.
    const neighborhoods = [...new Set(onView.map(s => s.neighborhood).filter(Boolean))]
      .sort((a, b) => neighborhoodRank(a) - neighborhoodRank(b) || a.localeCompare(b));
    if (onViewNeighborhood !== null && !neighborhoods.includes(onViewNeighborhood)) {
      onViewNeighborhood = null; // stored tab no longer has anything on view
    }
    const allShows = onView.filter(s => !isHamptons(s));
    const tabs = `<div class="tabs">
      <a data-nbhd="" class="${onViewNeighborhood === null ? "active" : ""}">All (${allShows.length})</a>
      ${neighborhoods.map(n => {
        const count = onView.filter(s => (s.neighborhood || "") === n).length;
        return `<a data-nbhd="${escapeHTML(n)}" class="${onViewNeighborhood === n ? "active" : ""}">${escapeHTML(capWords(n))} (${count})</a>`;
      }).join("")}
    </div>`;

    const pool = onViewNeighborhood === null
      ? allShows
      : onView.filter(s => (s.neighborhood || "") === onViewNeighborhood);
    if (!pool.length) return tabs + `<div class="empty">nothing here</div>`;

    // a single neighborhood needs no headings; "All" keeps them as dividers
    if (onViewNeighborhood !== null) {
      return tabs + `<div class="entries">${bookmarkedFirst(sortByLatitude(pool)).map(entryHTML).join("")}</div>`;
    }

    const groups = groupByKey(pool, s => s.neighborhood || "",
      (a, b) => neighborhoodRank(a[0]) - neighborhoodRank(b[0]) || a[0].localeCompare(b[0]));
    return tabs + groups.map(([nbhd, items]) => `
      <div class="date-head"><span>${capWords(nbhd) || "Unknown"}</span></div>
      <div class="entries">${bookmarkedFirst(sortByLatitude(items)).map(entryHTML).join("")}</div>
    `).join("");
  }

  // the basemap is a hand-cropped vector artboard; corners were given as
  // lat/long, so a plain linear (equirectangular) interpolation across the
  // artboard is the correct mapping — no Mercator/tile math needed anymore.
  function lonToSvgX(lon) {
    return (lon - ARTBOARD_LON_MIN) / (ARTBOARD_LON_MAX - ARTBOARD_LON_MIN) * ARTBOARD_W + PLOT_DX;
  }
  function latToSvgY(lat) {
    return (ARTBOARD_LAT_MAX - lat) / (ARTBOARD_LAT_MAX - ARTBOARD_LAT_MIN) * ARTBOARD_H + PLOT_DY;
  }

  function showsToPoints(shows) {
    const pts = [];
    for (const s of shows) {
      if (!s.latitude || !s.longitude) continue;
      const x = lonToSvgX(s.longitude);
      const y = latToSvgY(s.latitude);
      if (x < 0 || y < 0 || x > ARTBOARD_W || y > ARTBOARD_H) continue;
      pts.push({ x, y, show: s });
    }
    return pts;
  }

  function renderMapPage(kind) {
    if (!latestShows) return `<div class="empty">no show data yet</div>`;

    const { openingSoon, onView } = computeLists(latestShows.shows);
    let shows;
    let subtabsHTML = "";

    if (kind === "opening") {
      const groups = groupByKey(openingSoon, s => nycDateKey(s.opening_start_time));
      if (openingMapDate === null || !groups.some(([k]) => k === openingMapDate)) {
        openingMapDate = groups.length ? groups[0][0] : null;
      }
      subtabsHTML = `<div class="tabs">
        ${groups.map(([dateKey, items]) => `<a data-date="${dateKey}" class="${openingMapDate === dateKey ? "active" : ""}">${fmtDateHeading(dateKey)} (${items.length})</a>`).join("")}
      </div>`;
      const activeGroup = groups.find(([k]) => k === openingMapDate);
      shows = activeGroup ? activeGroup[1] : [];
    } else {
      shows = onView;
    }

    const points = showsToPoints(shows);

    mapPoints = points;
    mapKind = kind;
    mapListSig = "";

    return `
      ${subtabsHTML}
      <div class="mapframe">
      <div class="mapwrap" id="mapwrap">
        <div class="mapinner" id="mapinner">
          ${points.map(p => `
            <a class="dot" data-id="${p.show.id}" data-x="${p.x}" data-y="${p.y}" href="${escapeHTML(p.show.share_url || "")}" target="_blank" rel="noopener" title="${escapeHTML(p.show.title || p.show.headline || p.show.name)}"></a>
            <div class="dot-label" data-x="${p.x}" data-y="${p.y}">${escapeHTML(p.show.name)}</div>
          `).join("")}
          ${userLoc ? `<div class="me" data-x="${lonToSvgX(userLoc.lon)}" data-y="${latToSvgY(userLoc.lat)}"></div>` : ""}
        </div>
      </div>
      </div>
      <div class="map-controls">
        <button id="zoomOut" aria-label="zoom out">&minus;</button>
        <button id="zoomIn" aria-label="zoom in">+</button>
        <button id="locate" class="loc" aria-label="show my location"></button>
      </div>
      <div class="entries maplist" id="maplist"></div>
    `;
  }

  function sortForMap(shows) {
    if (mapKind === "opening") return geoSort(shows);
    return shows.slice().sort((a, b) =>
      neighborhoodRank(a.neighborhood) - neighborhoodRank(b.neighborhood) ||
      b.latitude - a.latitude);
  }

  // Everything on screen, listed underneath — nothing else, bookmarked or not.
  // Being on screen decides whether a row is listed at all; being bookmarked
  // only decides where in that list it sits.
  function updateMapList() {
    const host = document.getElementById("maplist");
    const wrap = document.getElementById("mapwrap");
    if (!host || !wrap || !mapScale) return;

    const left = wrap.scrollLeft;
    const top = wrap.scrollTop;
    const right = left + wrap.clientWidth;
    const bottom = top + wrap.clientHeight;

    const pinned = [];
    const onScreen = [];
    for (const p of mapPoints) {
      const x = p.x * mapScale;
      const y = p.y * mapScale;
      if (x < left || x > right || y < top || y > bottom) continue;
      // still pinned once bookmarked, so an accidental un-bookmark does not
      // drop the row out from under the tap — but only while it is on screen
      if (stickyTop.has(String(p.show.id))) pinned.push(p.show);
      else onScreen.push(p.show);
    }

    const rows = [...sortForMap(pinned), ...sortForMap(onScreen)];
    const sig = rows.map(s => s.id).join(",");
    if (sig === mapListSig) return; // nothing moved; don't rebuild mid-scroll
    mapListSig = sig;
    host.innerHTML = rows.map(entryHTML).join("");
    applyBookmarkStyles();
  }

  function centerOn(wrap, imgX, imgY, scale) {
    wrap.scrollLeft = Math.max(0, imgX * scale - wrap.clientWidth / 2);
    wrap.scrollTop = Math.max(0, imgY * scale - wrap.clientHeight / 2);
  }

  function applyMapScale() {
    const wrap = document.getElementById("mapwrap");
    const inner = document.getElementById("mapinner");
    if (!wrap || !inner) return;
    // may be null on the first paint, before map.svg has arrived, or for good
    // if it failed to load — dots and the list must not depend on it
    const svg = inner.querySelector("svg");

    const fitScale = Math.min(1, wrap.clientWidth / ARTBOARD_W);
    // Three more 1.6x steps than the map alone needs. Past roughly 40 the
    // basemap stops being informative, but the list under it is filtered by
    // what is on screen, so tighter zoom is how you pare a dense block down to
    // a handful of rows.
    const maxScale = 168;

    let needsCenter = false;
    if (mapScale === null) {
      mapScale = Math.max(fitScale, Math.min(maxScale, 1));
      needsCenter = true;
    }
    mapScale = Math.max(fitScale, Math.min(maxScale, mapScale));

    const w = ARTBOARD_W * mapScale;
    const h = ARTBOARD_H * mapScale;
    inner.style.width = w + "px";
    inner.style.height = h + "px";
    if (svg) {
      svg.style.width = w + "px";
      svg.style.height = h + "px";
    }

    // Each label is emitted directly after its dot, so walk the sibling rather
    // than pairing two queries by index — an index pair breaks silently the
    // moment anything else is added between them.
    for (const dot of inner.querySelectorAll(".dot")) {
      const x = parseFloat(dot.dataset.x) * mapScale;
      const y = parseFloat(dot.dataset.y) * mapScale;
      dot.style.left = x + "px";
      dot.style.top = y + "px";
      const label = dot.nextElementSibling;
      if (label && label.classList.contains("dot-label")) {
        label.style.left = x + "px";
        label.style.top = (y + 9) + "px";
      }
    }
    // labels always show — no crowding/collision hiding

    const me = inner.querySelector(".me");
    if (me) {
      me.style.left = parseFloat(me.dataset.x) * mapScale + "px";
      me.style.top = parseFloat(me.dataset.y) * mapScale + "px";
    }

    if (needsCenter) {
      if (mapCenterImgX === null) {
        mapCenterImgX = lonToSvgX(DEFAULT_MAP_CENTER.lon);
        mapCenterImgY = latToSvgY(DEFAULT_MAP_CENTER.lat);
      }
      centerOn(wrap, mapCenterImgX, mapCenterImgY, mapScale);
    } else if (mapCenterImgX !== null) {
      centerOn(wrap, mapCenterImgX, mapCenterImgY, mapScale);
    }

    updateMapList();
  }

  function saveCamera(wrap) {
    if (!mapScale) return;
    mapCenterImgX = (wrap.scrollLeft + wrap.clientWidth / 2) / mapScale;
    mapCenterImgY = (wrap.scrollTop + wrap.clientHeight / 2) / mapScale;
  }

  function zoomBy(factor) {
    const wrap = document.getElementById("mapwrap");
    if (!wrap) return;
    const centerImgX = (wrap.scrollLeft + wrap.clientWidth / 2) / mapScale;
    const centerImgY = (wrap.scrollTop + wrap.clientHeight / 2) / mapScale;
    mapScale *= factor;
    mapCenterImgX = centerImgX;
    mapCenterImgY = centerImgY;
    applyMapScale();
    centerOn(wrap, centerImgX, centerImgY, mapScale);
  }

  let pinchStartDist = null;
  let pinchStartScale = null;

  function touchDist(t0, t1) {
    return Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
  }

  function attachPinchHandlers(wrap) {
    wrap.addEventListener("scroll", () => {
      saveCamera(wrap);
      // Called straight through rather than via requestAnimationFrame: the
      // visibility pass is a few hundred comparisons and the list only rebuilds
      // when the rows actually change, so rAF bought nothing and stopped
      // updating entirely whenever the page was not being painted.
      updateMapList();
    }, { passive: true });

    wrap.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        pinchStartDist = touchDist(e.touches[0], e.touches[1]);
        pinchStartScale = mapScale;
      }
    }, { passive: true });

    wrap.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2 && pinchStartDist) {
        e.preventDefault();
        const dist = touchDist(e.touches[0], e.touches[1]);
        const factor = dist / pinchStartDist;
        const centerImgX = (wrap.scrollLeft + wrap.clientWidth / 2) / mapScale;
        const centerImgY = (wrap.scrollTop + wrap.clientHeight / 2) / mapScale;
        mapScale = pinchStartScale * factor;
        mapCenterImgX = centerImgX;
        mapCenterImgY = centerImgY;
        applyMapScale();
        centerOn(wrap, centerImgX, centerImgY, mapScale);
      }
    }, { passive: false });

    const endPinch = (e) => {
      if (e.touches.length < 2) {
        pinchStartDist = null;
        pinchStartScale = null;
      }
    };
    wrap.addEventListener("touchend", endPinch, { passive: true });
    wrap.addEventListener("touchcancel", endPinch, { passive: true });
  }

  // Moves the blue dot without rebuilding the page — a re-render on every
  // 20-second fix would throw away the scroll position mid-pan.
  function positionMeDot() {
    const inner = document.getElementById("mapinner");
    if (!inner || !mapScale) return;
    let me = inner.querySelector(".me");
    const x = userLoc ? lonToSvgX(userLoc.lon) : 0;
    const y = userLoc ? latToSvgY(userLoc.lat) : 0;
    const onMap = userLoc && x >= 0 && y >= 0 && x <= ARTBOARD_W && y <= ARTBOARD_H;
    if (!onMap) {
      me?.remove();
      return;
    }
    if (!me) {
      me = document.createElement("div");
      me.className = "me";
      inner.appendChild(me);
    }
    me.dataset.x = x;
    me.dataset.y = y;
    me.style.left = x * mapScale + "px";
    me.style.top = y * mapScale + "px";
  }

  // Failures (permission refused, no fix, off the artboard) are deliberately
  // silent — no status text next to the button.
  function requestFix(recenter) {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        if (!locationOn) return; // toggled off while the fix was in flight
        userLoc = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        positionMeDot();
        // only the initial press moves the map; later fixes must not yank the
        // view out from under someone reading a different part of the city
        if (!recenter) return;
        const x = lonToSvgX(userLoc.lon);
        const y = latToSvgY(userLoc.lat);
        if (x < 0 || y < 0 || x > ARTBOARD_W || y > ARTBOARD_H) return;
        mapCenterImgX = x;
        mapCenterImgY = y;
        const wrap = document.getElementById("mapwrap");
        if (wrap) centerOn(wrap, x, y, mapScale);
      },
      () => {},
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 15000 }
    );
  }

  function startLocationTimer() {
    stopLocationTimer();
    locationTimer = setInterval(() => requestFix(false), LOCATION_INTERVAL_MS);
  }

  function stopLocationTimer() {
    if (locationTimer) clearInterval(locationTimer);
    locationTimer = null;
  }

  function toggleLocation() {
    locationOn = !locationOn;
    if (locationOn) {
      requestFix(true);
      startLocationTimer();
    } else {
      stopLocationTimer();
      userLoc = null;
      positionMeDot();
    }
  }

  // The basemap used to be inlined in this file, which the artifact sandbox
  // required. It no longer is: 2.3MB of vector art that almost never changes
  // does not belong in a page that redeploys whenever the show data moves.
  // Fetched once, parsed once, then cloned in — and cached by the browser
  // across deploys, since map.svg keeps its own ETag.
  let basemapPromise = null;
  let basemapSVG = null;

  function loadBasemap() {
    if (!basemapPromise) {
      basemapPromise = fetch("map.svg")
        .then(r => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then(text => {
          const parsed = new DOMParser().parseFromString(text, "image/svg+xml");
          const svg = parsed.documentElement;
          if (!svg || svg.nodeName.toLowerCase() !== "svg") throw new Error("not an svg");
          basemapSVG = svg;
          return svg;
        });
    }
    return basemapPromise;
  }

  // Puts the art behind the dots. Safe to call repeatedly; does nothing once
  // the map is already in place.
  function insertBasemap() {
    const inner = document.getElementById("mapinner");
    if (!inner || inner.querySelector("svg")) return;
    if (basemapSVG) {
      inner.prepend(document.importNode(basemapSVG, true));
      applyMapScale();
      return;
    }
    loadBasemap().then(svg => {
      const host = document.getElementById("mapinner");
      if (host && !host.querySelector("svg")) host.prepend(document.importNode(svg, true));
      applyMapScale();
    }).catch(() => {
      // no art, but the dots and the list under the map still work
    });
  }

  // ==================================================================
  // The street, one floor below the listings.
  //
  // Scale comes from the pavement: Tribeca sidewalks run ~4 m, drawn 34 px,
  // so 8.5 px/m. Every size and speed below is a real quantity through it.
  //
  // Camera 220 m up over 20 m rooftops — six cast-iron storeys. Image
  // motion goes as 1/depth, so the street runs at (220-20)/220 = 0.909 of
  // the roofs and the wall down a gap is 0.1 x its distance off-centre.
  //
  // Deliberately few colours: four roofs, three pavements, two coats and
  // five cars per scene, and no more.
  // ==================================================================

  const PX_PER_M = 8.5;
  const M = (m) => m * PX_PER_M;
  const ROOF_H_M = 20, CAM_H_M = 220;
  const PARALLAX = (CAM_H_M - ROOF_H_M) / CAM_H_M;
  const FACADE_RATIO = ROOF_H_M / (CAM_H_M - ROOF_H_M);

  const GUTTER = 96;
  const WALK_W = 32;                 // 3.8 m pavement
  // A box truck is 2.35 m — 20 px. The old 16 px lanes were narrower than the
  // widest thing driving in them, which is why vehicles sat on each other.
  const PARK_W = 20, LANE_W = 22;
  const R = Math.round;              // everything lands on whole pixels
  const PED_R = 4;                   // every person the same size
  const ROAD_W = PARK_W * 2 + LANE_W;
  const CROSS_H = WALK_W * 2 + ROAD_W;   // 116px: the fixed cross-street section
  const TILE = 900;

  const VEHICLES = [
    { kind: "sedan", len: M(4.6), wide: M(1.8),  hood: .26, glass: .13, rear: .72, rearH: .10 },
    { kind: "sedan", len: M(4.4), wide: M(1.75), hood: .25, glass: .13, rear: .71, rearH: .10 },
    { kind: "suv",   len: M(4.9), wide: M(1.95), hood: .22, glass: .14, rear: .78, rearH: .12 },
    { kind: "van",   len: M(5.4), wide: M(2.0),  hood: .14, glass: .13, rear: .86, rearH: .08 },
    { kind: "truck", len: M(7.0), wide: M(2.35), hood: .10, glass: .09, rear: 0,  rearH: 0, body: .24 },
  ];
  const MIX = [0, 0, 0, 1, 1, 2, 2, 3, 4];

  const SCENE = {
    night: {
      cloud: "#2A2730", glow: [255, 214, 150], land: "#191519", landBlock: "#241C14",
      void: "#0A0A0C", asphalt: "#191A20", avenue: "#131419",
      walks: ["#4A3B2B", "#3E3830", "#54452F"],
      glass: "#0A0908", paint: "#6B6863",
      cars: ["#141312", "#141312", "#2A2724", "#3A3632", "#4A2F2A", "#6B6863"],
      coats: ["#141210", "#241C16"],
      head: [255, 244, 214], tail: [196, 42, 30], gallery: [226, 236, 255],
      density: { walkers: 30, cars: 6, fieldWalkers: 22 },
      night: true,
    },
    day: {
      cloud: "#EDEBE6", glow: null, land: "#DED8D3", landBlock: "#BFB8B2",
      void: "#8E8A8C", asphalt: "#3B3A44", avenue: "#6E6E74",
      walks: ["#A89C96", "#A3A0A0", "#B0A49D"],
      glass: "#16151A", paint: "#B6B2B0",
      cars: ["#232323", "#232323", "#DDDCDC", "#B6B2B0", "#8E3B34", "#E8B830"],
      coats: ["#1C1714", "#2A2018"],
      head: null, tail: null, gallery: null,
      density: { walkers: 11, cars: 4, fieldWalkers: 9 },
      night: false,
    },
  };

  let cv = null, cx = null, sceneKind = "night", sceneMode = "street";
  let walkers = [], avCars = [], avParkA = [], avParkB = [], fieldWalkers = [], slabs = [];
  let crossStreets = new Map();
  let lastT = -1e9, lastPar = 0, rafId = null, clock = 0;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[(Math.random() * a.length) | 0];
  const spec = () => VEHICLES[MIX[(Math.random() * MIX.length) | 0]];

  function geom() {
    const el = document.getElementById("content");
    const r = el ? el.getBoundingClientRect() : { right: Math.min(innerWidth, 640) - 12 };
    const walkX = r.right - GUTTER;
    const roadX = walkX + WALK_W;
    return { walkX, roadX, fieldW: walkX,
             parkA: roadX, lane: roadX + PARK_W, parkB: roadX + PARK_W + LANE_W,
             roadEnd: roadX + ROAD_W };
  }

  const LANES = 2;
  const laneX = (g, l) => g.walkX + 9 + l * (WALK_W - 18);

  function makeCar(S, y) {
    const v = spec();
    return { y, spec: v, speed: M(rnd(6.7, 9.4)), color: pick(S.cars), stopped: false };
  }

  // Pavement drifts between its three tones in long even runs broken by short
  // patched stretches — poured slabs, then a piece of pavement someone cut up.
  function buildSlabs(S) {
    slabs = [];
    let y = 0;
    while (y < TILE) {
      const calm = Math.random() < 0.62;
      const end = y + (calm ? rnd(140, 330) : rnd(50, 110));
      const steady = calm ? pick(S.walks) : null;
      while (y < end && y < TILE) {
        const h = calm ? rnd(34, 90) : rnd(12, 28);
        slabs.push({ y, h, c: steady || pick(S.walks) });
        y += h;
      }
    }
  }

  function parkRow(S, H) {
    const row = [];
    let y = rnd(-80, 20);
    while (y < H + 80) {
      if (Math.random() < 0.76) { const c = makeCar(S, y); row.push(c); y += c.spec.len + rnd(3, 9); }
      else y += rnd(30, 70);                 // hydrant, driveway, or just a space
    }
    return row;
  }

  function populate() {
    const S = SCENE[sceneKind], g = geom(), H = innerHeight;

    walkers = [];
    for (let i = 0; i < S.density.walkers; i++) {
      const v = M(rnd(1.1, 1.6));
      walkers.push({ y: rnd(-40, H + 40), lane: (Math.random() * LANES) | 0, lx: 0,
                     dir: Math.random() < 0.5 ? 1 : -1, speed: v, base: v,
                     r: PED_R, color: pick(S.coats), hold: 0 });
    }
    if (S.night) for (let k = 0; k < 4; k++) {
      const y = rnd(0, H), lane = (Math.random() * LANES) | 0;
      for (let m = 0, n = 2 + ((Math.random() * 3) | 0); m < n; m++)
        walkers.push({ y: y + rnd(-9, 9), lane, lx: 0, dir: 0, speed: 0, base: 0,
                       r: PED_R, color: pick(S.coats), hold: Infinity });
    }
    walkers.forEach(w => { w.lx = laneX(g, w.lane); });

    avCars = [];
    for (let i = 0; i < S.density.cars; i++) avCars.push(makeCar(S, rnd(-200, H + 200)));
    avParkA = parkRow(S, H);
    avParkB = parkRow(S, H);

    fieldWalkers = [];
    for (let i = 0; i < S.density.fieldWalkers; i++)
      fieldWalkers.push({ x: rnd(0, g.fieldW), y: rnd(0, H), dir: Math.random() < 0.5 ? 1 : -1,
                          speed: M(rnd(1.1, 1.6)), r: PED_R, color: pick(S.coats) });

    crossStreets.clear();
    buildSlabs(S);
  }

  // Each heading keeps its own cross street, keyed by its text so it survives
  // scrolling and re-renders instead of being rebuilt underneath you.
  function crossFor(key, S, W) {
    let c = crossStreets.get(key);
    if (!c) {
      c = { cars: [], parkT: [], parkB: [], peds: [], occ: null };
      for (let i = 0; i < 3; i++) c.cars.push({ x: rnd(-200, W), spec: spec(), speed: M(rnd(6.7, 9.4)), color: pick(S.cars) });
      for (const row of ["parkT", "parkB"]) {
        let x = rnd(-80, 20);
        while (x < W) {
          if (Math.random() < 0.52) { const v = spec(); c[row].push({ x, spec: v, color: pick(S.cars) }); x += v.len + rnd(4, 14); }
          else x += rnd(44, 110);
        }
      }
      for (let i = 0; i < 7; i++)
        c.peds.push({ x: rnd(0, W), side: Math.random() < .5 ? 0 : 1, off: rnd(7, 27),
                      dir: Math.random() < .5 ? 1 : -1, speed: M(rnd(1.1, 1.6)),
                      r: PED_R, color: pick(S.coats) });
      crossStreets.set(key, c);
    }
    return c;
  }

  // ---- movement ----------------------------------------------------
  function stepWalkers(dt, g, H) {
    for (const w of walkers) {
      if (w.hold === Infinity) continue;
      let limit = w.base, blocked = false;
      for (const o of walkers) {
        if (o === w) continue;
        const dy = (o.y - w.y) * w.dir;
        if (dy < 0 || dy > 60 || Math.abs(o.lx - w.lx) > 8) continue;
        if (o.dir === w.dir && o.hold !== Infinity) { if (dy < 26) limit = Math.min(limit, o.speed * .92); }
        else if (dy < 40) blocked = true;
      }
      if (blocked) {
        const t = w.lane === 0 ? 1 : 0, tx = laneX(g, t);
        if (!walkers.some(o => o !== w && Math.abs(o.lx - tx) < 8 && Math.abs(o.y - w.y) < 24)) w.lane = t;
        limit = Math.min(limit, w.base * .45);
      }
      const tx = laneX(g, w.lane);
      w.lx += Math.max(-42 * dt, Math.min(42 * dt, tx - w.lx));
      w.speed += (limit - w.speed) * Math.min(1, dt * 3);
      w.y += w.dir * w.speed * dt;
      if (w.y < -60) w.y = H + 60;
      if (w.y > H + 60) w.y = -60;
    }
  }

  // Where every visible cross street crosses the avenue. Both directions read
  // the same list, which is what lets them take turns at the box.
  // The gap is a hole in the roofs, and the roofs travel at 1.0 while the
  // ground travels at PARALLAX. Drawing the cross street at the hole's own
  // position therefore pinned it to the roofs, and it slid against the avenue
  // — the two halves of one ground plane moving at different rates. Shifting
  // it by the difference puts it back on the ground with the avenue. Clamped,
  // so a street can never walk far enough to leave its own gap.
  function intersections() {
    const out = [];
    for (const el of document.querySelectorAll(".date-head")) {
      const r = el.getBoundingClientRect();
      if (r.bottom < -160 || r.top > innerHeight + 160) continue;
      const shift = Math.max(-40, Math.min(40, -(1 - PARALLAX) * r.top));
      const top = r.top + shift;
      out.push({ el, key: el.textContent.trim(), shift, top,
                 roadTop: top + WALK_W, roadBot: top + WALK_W + ROAD_W, bot: top + CROSS_H });
    }
    return out;
  }

  // the heading rides with its street, not with the roof it sits in
  function lockHeadings(boxes) {
    for (const b of boxes) {
      const span = b.el.firstElementChild;
      if (span) span.style.transform = "translateY(" + b.shift.toFixed(1) + "px)";
    }
  }

  const GAP_M = M(1.4);   // 1.4 m of daylight between bumpers

  // A queue on a one-way street: nobody may pass through the car in front, and
  // nobody may enter a junction that is not theirs. Positions are clamped
  // outright rather than nudged by braking, so an overlap is not possible.
  function queue(list, getPos, setPos, lenOf, stopLine) {
    list.sort((a, b) => getPos(b) - getPos(a));       // leader first
    for (let i = 0; i < list.length; i++) {
      const c = list[i];
      let cap = stopLine ? stopLine(c) : Infinity;    // a red light ahead
      if (i > 0) {
        const lead = list[i - 1];
        cap = Math.min(cap, getPos(lead) - lenOf(lead) - GAP_M);
      }
      if (getPos(c) > cap) { setPos(c, cap); c.stopped = true; } else c.stopped = false;
    }
  }

  // A real all-way stop: everyone halts at the line, and the box is released
  // to whoever got there first. Nobody moves off until the car occupying the
  // junction is clear of it.
  const STOP_DWELL = 0.4;   // you have to actually stop, not roll through

  function control(st, b, g) {
    if (st.occ) {
      const c = st.occ.car;
      const clear = st.occ.side === "av" ? c.y > b.roadBot + 4
                                         : c.x > g.walkX + ROAD_W + 4;
      const gone = st.occ.side === "av" ? !avCars.includes(c) : !st.cars.includes(c);
      if (clear || gone) st.occ = null; else return;
    }
    let best = null;
    const consider = (car, t, side) => { if (!best || t < best.t) best = { t, side, car }; };
    for (const c of avCars) {
      if (Math.abs((c.y + c.spec.len) - (b.roadTop - 3)) > 2) continue;
      c.waits = c.waits || {};
      if (c.waits[b.key] == null) c.waits[b.key] = clock;
      if (clock - c.waits[b.key] >= STOP_DWELL) consider(c, c.waits[b.key], "av");
    }
    for (const c of st.cars) {
      if (Math.abs((c.x + c.spec.len) - (g.walkX - 4)) > 2) continue;
      if (c.waitAt == null) c.waitAt = clock;
      if (clock - c.waitAt >= STOP_DWELL) consider(c, c.waitAt, "cr");
    }
    if (best) {
      st.occ = { side: best.side, car: best.car };
      if (best.side === "av") best.car.waits[b.key] = null; else best.car.waitAt = null;
    }
  }

  function stepAvenue(dt, g, H) {
    const boxes = intersections();
    for (const b of boxes) control(crossFor(b.key, SCENE[sceneKind], g.fieldW), b, g);
    for (const c of avCars) c.y += c.speed * dt;
    queue(avCars, c => c.y + c.spec.len, (c, v) => { c.y = v - c.spec.len; },
          c => c.spec.len,
          (c) => {
            let best = Infinity;
            for (const b of boxes) {
              const st = crossStreets.get(b.key);
              if (!st) continue;
              const line = b.roadTop - 3;
              if (c.y + c.spec.len > line + 1) continue;   // already at or in the box
              if (st.occ && st.occ.car === c) continue;    // it is this car's turn
              best = Math.min(best, line);
            }
            return best;
          });
    for (const c of avCars) if (c.y > H + 220) c.y = -220 - Math.random() * 200;
    for (const f of fieldWalkers) {
      f.x += f.dir * f.speed * dt;
      if (f.x < -10) f.x = g.fieldW + 10;
      if (f.x > g.fieldW + 10) f.x = -10;
    }
  }

  // People turn at the corner instead of walking on through the junction.
  // The avenue's list and each cross street's list hand walkers back and
  // forth, so it is one population on one pavement network rather than two
  // sets of people that happen to look alike.
  function turnPeds(dt, g, S) {
    const boxes = intersections();
    if (!boxes.length) return;

    if (walkers.length > 14) for (let i = walkers.length - 1; i >= 0; i--) {
      const w = walkers[i];
      if (w.hold === Infinity) continue;
      for (const b of boxes) {
        if (w.y < b.roadTop - 2 || w.y > b.roadBot + 2) continue;
        if (Math.random() > 1.1 * dt) continue;          // most carry straight on
        const st = crossFor(b.key, S, g.fieldW);
        st.peds.push({ x: g.walkX - 8, side: Math.random() < .5 ? 0 : 1,
                       off: rnd(7, WALK_W - 7), dir: -1, speed: w.speed,
                       r: PED_R, color: w.color });
        walkers.splice(i, 1);
        break;
      }
    }

    for (const b of boxes) {
      const st = crossStreets.get(b.key);
      if (!st) continue;
      for (let i = st.peds.length - 1; i >= 0; i--) {
        const p = st.peds[i];
        if (p.dir < 0 || p.x < g.walkX - 10) continue;   // reached the corner
        const lane = (Math.random() * LANES) | 0;
        walkers.push({ y: b.top + (p.side ? CROSS_H - 10 : 10), lane, lx: laneX(g, lane),
                       dir: Math.random() < .5 ? 1 : -1, speed: p.speed, base: p.speed,
                       r: PED_R, color: p.color, hold: 0 });
        st.peds.splice(i, 1);
      }
    }
  }

  function stepCross(dt, g, W) {
    for (const b of intersections()) {
      const st = crossFor(b.key, SCENE[sceneKind], g.fieldW);
      for (const c of st.cars) c.x += c.speed * dt;
      queue(st.cars, c => c.x + c.spec.len, (c, v) => { c.x = v - c.spec.len; },
            c => c.spec.len,
            (c) => (st.occ && st.occ.car === c) || (c.x + c.spec.len > g.walkX - 3)
                     ? Infinity : g.walkX - 4);
      for (const c of st.cars) if (c.x > g.fieldW + 60) c.x = -220 - Math.random() * 160;
      for (const p of st.peds) {
        p.x += p.dir * p.speed * dt;
        if (p.x < -30) p.x = g.walkX - 12;     // back in at the corner
      }
    }
  }

  // ---- drawing -----------------------------------------------------
  const disc = (x, y, r, c) => { cx.fillStyle = c; cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.fill(); };
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  function beam(x, y, w, h, colour, dir, s) {
    const G = dir === "down"  ? cx.createLinearGradient(0, y, 0, y + h)
            : dir === "up"    ? cx.createLinearGradient(0, y + h, 0, y)
            : dir === "right" ? cx.createLinearGradient(x, 0, x + w, 0)
            :                   cx.createLinearGradient(x + w, 0, x, 0);
    G.addColorStop(0, rgba(colour, s));
    G.addColorStop(1, rgba(colour, 0));
    cx.fillStyle = G; cx.fillRect(x, y, w, h);
  }

  function vehV(x, yFront, sp, colour, glass) {
    const y = yFront - sp.len;
    cx.fillStyle = colour; cx.fillRect(x, y, sp.wide, sp.len);
    if (sp.body) { cx.fillStyle = SCENE[sceneKind].cars[2]; cx.fillRect(x, y, sp.wide, sp.len * (1 - sp.body)); }
    cx.fillStyle = glass;
    cx.fillRect(x, yFront - sp.len * (sp.hood + sp.glass), sp.wide, sp.len * sp.glass);
    if (sp.rear) cx.fillRect(x, yFront - sp.len * (sp.rear + sp.rearH), sp.wide, sp.len * sp.rearH);
  }

  function vehH(y, xFront, sp, colour, glass) {
    const x = xFront - sp.len;
    cx.fillStyle = colour; cx.fillRect(x, y, sp.len, sp.wide);
    if (sp.body) { cx.fillStyle = SCENE[sceneKind].cars[2]; cx.fillRect(x, y, sp.len * (1 - sp.body), sp.wide); }
    cx.fillStyle = glass;
    cx.fillRect(xFront - sp.len * (sp.hood + sp.glass), y, sp.len * sp.glass, sp.wide);
    if (sp.rear) cx.fillRect(xFront - sp.len * (sp.rear + sp.rearH), y, sp.len * sp.rearH, sp.wide);
  }

  // A cross street is the same section as the avenue, at fixed offsets from the
  // top of its band — pavement, parking, one lane, parking, pavement. Nothing
  // about it moves with the perspective; the building simply overlaps more or
  // less of it, which is what reads as depth.
  function drawCross(g, b, S) {
    const st = crossFor(b.key, S, g.fieldW);
    const bl = R(g.walkX);                         // the building line
    const thru = R(g.roadX) + ROAD_W;              // far kerb of the avenue
    const top = R(b.top), roadTop = R(b.roadTop), roadBot = R(b.roadBot);

    // the carriageway runs all the way through the junction, so traffic does
    // not disappear behind the corner
    cx.fillStyle = S.avenue; cx.fillRect(0, roadTop, thru, ROAD_W);

    cx.save();                                     // pavements stop at the corner
    cx.beginPath(); cx.rect(0, top, bl, CROSS_H); cx.clip();
    for (const s of slabs) {
      cx.fillStyle = s.c;
      const sx = R(s.y - 40), sw = R(s.h) + 1;
      cx.fillRect(sx, top, sw, WALK_W);
      cx.fillRect(sx, roadBot, sw, WALK_W);
    }
    cx.restore();

    cx.save();
    cx.beginPath(); cx.rect(0, top, thru, CROSS_H); cx.clip();

    // paint goes down before anything drives over it
    cx.fillStyle = S.paint;
    for (let i = 0; i < 5; i++) {
      const y = roadTop + 3 + i * 12;
      if (y + 7 < roadBot) cx.fillRect(bl - 24, y, 20, 7);
    }

    const laneY = roadTop + PARK_W;
    for (const p of st.parkT) vehH(roadTop, R(p.x + p.spec.len), p.spec, p.color, S.glass);
    for (const p of st.parkB) vehH(roadBot - PARK_W, R(p.x + p.spec.len), p.spec, p.color, S.glass);
    if (S.night) for (const c of st.cars) {
      beam(R(c.x + c.spec.len), laneY, 46, R(c.spec.wide), S.head, "right", .5);
      beam(R(c.x) - 26, laneY, 26, R(c.spec.wide), S.tail, "left", .32);
    }
    for (const c of st.cars) vehH(laneY, R(c.x + c.spec.len), c.spec, c.color, S.glass);
    for (const p of st.peds)
      disc(R(p.x), R(p.side ? b.roadBot + p.off - 4 : b.top + p.off), p.r, p.color);
    cx.restore();
  }

  function draw(par) {
    const S = SCENE[sceneKind], W = innerWidth, H = innerHeight;

    if (sceneMode === "clouds") {
      cx.fillStyle = S.cloud; cx.fillRect(0, 0, W, H);
      drawMapGlow(S);   // the opening is the brightest thing up here
      return;
    }

    const g = geom();
    cx.fillStyle = S.void; cx.fillRect(0, 0, W, H);
    cx.fillStyle = S.asphalt; cx.fillRect(0, 0, R(g.fieldW), H);
    cx.fillStyle = S.avenue; cx.fillRect(R(g.roadX), 0, ROAD_W, H);

    const off = ((par % TILE) + TILE) % TILE;
    for (let t = -TILE; t < H + TILE; t += TILE) {
      const base = t - off;
      for (const s of slabs) { cx.fillStyle = s.c; cx.fillRect(R(g.walkX), R(base + s.y), WALK_W, R(s.h) + 1); }
    }

    const boxes = intersections();
    // the pavement stops at a junction; the cross street runs through it
    for (const b of boxes) {
      cx.fillStyle = S.avenue;
      cx.fillRect(R(g.walkX), R(b.roadTop), WALK_W, ROAD_W);
    }

    if (S.night) {
      // Gallery light stops at the kerb — it falls on the pavement, not the
      // road — and never inside a junction, where there is no gallery.
      for (let t = -TILE; t < H + TILE; t += TILE) {
        const base = t - off;
        for (let k = 0; k < 6; k++) {
          const y = R(base + k * 150 + 30);
          if (boxes.some(b => y + 34 > b.top && y < b.top + CROSS_H)) continue;
          beam(R(g.walkX), y, WALK_W, 34, S.gallery, "right", .5);
        }
      }
      for (const c of avCars) {                    // exactly the car's own width
        const cw = R(c.spec.wide);
        beam(R(g.lane), R(c.y + c.spec.len), cw, 54, S.head, "down", .5);
        beam(R(g.lane), R(c.y) - 30, cw, 30, S.tail, "up", .38);
      }
    }

    cx.fillStyle = S.paint;                        // paint first, then traffic
    for (const b of boxes) for (let i = 0; i < 5; i++) {
      const x = R(g.roadX) + 3 + i * 12;
      if (x + 7 < R(g.roadX) + ROAD_W) {
        cx.fillRect(x, R(b.roadTop) - 26, 7, 20);
        cx.fillRect(x, R(b.roadBot) + 6, 7, 20);
      }
    }
    for (const p of avParkA) vehV(R(g.parkA), R(p.y + p.spec.len), p.spec, p.color, S.glass);
    for (const p of avParkB) vehV(R(g.parkB), R(p.y + p.spec.len), p.spec, p.color, S.glass);
    for (const c of avCars) vehV(R(g.lane), R(c.y + c.spec.len), c.spec, c.color, S.glass);

    for (const b of boxes) drawCross(g, b, S);
    for (const f of fieldWalkers) disc(f.x, f.y, f.r, f.color);
    for (const w of walkers) disc(w.lx, w.y, w.r, w.color);
  }

  function frame(t) {
    rafId = requestAnimationFrame(frame);
    const par = scrollY * PARALLAX;
    const dt = Math.min(.05, (t - lastT) / 1000) || .016;
    lastT = t; clock += dt;
    if (!reduceMotion) {
      const g = geom(), H = innerHeight, W = innerWidth, dPar = par - lastPar;
      if (sceneMode === "street") {
        for (const w of walkers) w.y -= dPar;
        for (const c of avCars) c.y -= dPar;
        for (const row of [avParkA, avParkB]) for (const p of row) {
          p.y -= dPar;
          if (p.y < -200) p.y += H + 400;
          if (p.y > H + 200) p.y -= H + 400;
        }
        for (const f of fieldWalkers) f.y -= dPar;
        stepWalkers(dt, g, H);
        stepAvenue(dt, g, H);
        stepCross(dt, g, W);
        turnPeds(dt, g, SCENE[sceneKind]);
      }
    }
    lastPar = par;
    if (sceneMode === "street") lockHeadings(intersections());
    draw(par);
  }

  function sizeCanvas() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(innerWidth * dpr);
    cv.height = Math.round(innerHeight * dpr);
    cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function sceneSetKind(kind, mode) {
    sceneMode = mode || "street";
    document.documentElement.setAttribute("data-mode", sceneMode);
    if (kind === sceneKind && walkers.length) return;
    sceneKind = kind;
    document.documentElement.setAttribute("data-scene", kind);
    populate();
  }

  function sceneStart() {
    cv = document.getElementById("scene");
    cx = cv.getContext("2d");
    sizeCanvas(); populate();
    addEventListener("resize", () => { sizeCanvas(); populate(); }, { passive: true });
    lastPar = scrollY * PARALLAX;
    addEventListener("scroll", () => {
      if (performance.now() - lastT > 120) {
        // re-lock here too: this path runs precisely when frames are not, and
        // without it the headings stay pinned to the roofs
        if (sceneMode === "street") lockHeadings(intersections());
        draw(scrollY * PARALLAX);
      }
    }, { passive: true });
    rafId = requestAnimationFrame(frame);
  }

  // ---- the map, seen through a break in the cloud ------------------
  // Still, not animated. At night the city throws a glow out of the opening;
  // it runs off the four sides and stops short of the corners, so it reads as
  // a cross rather than a halo — the same shape the gallery light makes.
  function drawMapGlow(S) {
    const wrap = document.getElementById("mapwrap");
    if (!wrap || !S.glow) return;
    const r = wrap.getBoundingClientRect();
    const D = 44, INSET = 42;
    const w = r.width - INSET * 2, hh = r.height - INSET * 2;
    if (w > 0) {
      beam(R(r.left + INSET), R(r.top - D), R(w), D, S.glow, "up", .5);
      beam(R(r.left + INSET), R(r.bottom), R(w), D, S.glow, "down", .5);
    }
    if (hh > 0) {
      beam(R(r.left - D), R(r.top + INSET), D, R(hh), S.glow, "left", .5);
      beam(R(r.right), R(r.top + INSET), D, R(hh), S.glow, "right", .5);
    }
  }

  function cloudEdgeStart() {}
  function cloudEdgeStop() {}
  function renderTopNav() {
    const nav = document.getElementById("topnav");
    nav.innerHTML = PAGES.map(p =>
      `<a data-page="${p.id}" class="${currentPage === p.id ? "active" : ""}">${p.label}</a>`
    ).join("");
    nav.querySelectorAll("a").forEach(a => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        const prevWrap = document.getElementById("mapwrap");
        if (prevWrap) saveCamera(prevWrap);
        currentPage = a.dataset.page;
        renderTopNav();
        renderContent();
      });
    });
  }

  function renderContent() {
    const content = document.getElementById("content");
    // Openings is an opening night; On View is daylight. The scene follows the
    // page rather than the system theme, which is the whole point of it.
    sceneSetKind(currentPage.startsWith("onview") ? "day" : "night",
                 currentPage.endsWith("-map") ? "clouds" : "street");
    // don't keep polling GPS on the list pages; the map branch restarts it
    stopLocationTimer();

    if (currentPage === "opening") {
      content.innerHTML = renderOpeningPage();
      content.querySelectorAll(".daymap-link").forEach(a => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          openingMapDate = a.dataset.date;
          currentPage = "opening-map";
          renderTopNav();
          renderContent();
        });
      });
      cloudEdgeStop();
    } else if (currentPage === "onview") {
      content.innerHTML = renderOnViewPage();
      content.querySelectorAll(".tabs a[data-nbhd]").forEach(a => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          onViewNeighborhood = a.dataset.nbhd || null;
          renderContent();
        });
      });
    } else if (currentPage === "opening-map" || currentPage === "onview-map") {
      const kind = currentPage === "opening-map" ? "opening" : "onview";
      content.innerHTML = renderMapPage(kind);
      content.querySelectorAll(".tabs a[data-date]").forEach(a => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          const prevWrap = document.getElementById("mapwrap");
          if (prevWrap) saveCamera(prevWrap);
          openingMapDate = a.dataset.date;
          renderContent();
        });
      });
      insertBasemap();
      applyMapScale();
      const wrap = document.getElementById("mapwrap");
      document.getElementById("zoomIn")?.addEventListener("click", () => zoomBy(1.6));
      document.getElementById("zoomOut")?.addEventListener("click", () => zoomBy(1 / 1.6));
      document.getElementById("locate")?.addEventListener("click", toggleLocation);
      if (locationOn) startLocationTimer();
      if (wrap) attachPinchHandlers(wrap);
      cloudEdgeStart();
    }

    applyBookmarkStyles();
    saveView();
  }

  async function main() {
    document.getElementById("content").innerHTML = "loading...";
    restoreView();
    sceneSetKind(currentPage.startsWith("onview") ? "day" : "night",
                 currentPage.endsWith("-map") ? "clouds" : "street");
    sceneStart();
    renderTopNav();
    loadBookmarks();

    // delegated so it survives every re-render of the list
    document.getElementById("content").addEventListener("click", (e) => {
      const btn = e.target.closest(".bm");
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      toggleBookmark(btn.dataset.id);
    });

    try {
      const res = await fetch("data/nyc.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      latestShows = await res.json();
    } catch (e) {
      document.getElementById("content").innerHTML =
        `<div class="empty">couldn't load show data — try reloading</div>`;
      return;
    }

    renderUpdatedLine();
    renderContent();
    // start the map fetch now so the first map tab is not waiting on it
    loadBasemap().catch(() => {});
  }

  main();
</script>
</body>
</html>
