  // the top right. Six sides, one subpath.
  function hullTo(p, x, y, w, h, o) {
    p.moveTo(x - o, y - o);
    p.lineTo(x - o + w, y - o);
    p.lineTo(x + w, y);
    p.lineTo(x + w, y + h);
    p.lineTo(x, y + h);
    p.lineTo(x - o, y - o + h);
    p.closePath();
  }

  // A person's is a bar along the line the sun throws with the round of their
  // head on the end. One subpath, the arc inline: a circle added beside the
  // bar is a second subpath wound the other way, and a fill cancels where two
  // such cross — which left a clean hole through the middle of every one.
  function barTo(p, x, y, dx, dy, r) {
    const L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const nx = -uy * r, ny = ux * r, a = Math.atan2(ny, nx);
    p.moveTo(x + nx, y + ny);
    p.lineTo(x + dx + nx, y + dy + ny);
    p.arc(x + dx, y + dy, r, a, a - Math.PI, true);
    p.lineTo(x - nx, y - ny);
    p.closePath();
  }

  // The shadow a block throws up over its lower kerb and the cars standing at
  // it. Its forty-five degree edge runs from where the two pavements meet
  // along their building lines — the ground-level corner of the building
  // itself, not the kerb out in the road and not the roof edge a storey above
  // it — and it runs the whole depth of the shadow to get there, since at
  // forty-five degrees a cut is as long as the shadow is deep. Past that
  // corner the shadow runs straight down the side of the avenue.
  //
  // How deep: far enough to reach across the traffic lane. With the cut as
  // long as the shadow is deep that is also how far along the street the
  // corner reaches, and the flat part of it lands on the far kerb of the lane.
  const SHADE_D = WALK_W + PARK_W + LANE_W;

  function bandTo(p, b, bl) {
    const top = b.bot - SHADE_D;
    p.moveTo(0, top);
    p.lineTo(bl - SHADE_D, top);
    p.lineTo(bl, b.bot);
    p.lineTo(bl, b.gapBot);
    p.lineTo(0, b.gapBot);
    p.closePath();
  }

  function blockShade(g, boxes) {
    const p = new Path2D(), bl = R(g.walkX);
    for (const b of boxes) bandTo(p, b, bl);
    return p;
  }

  // Everywhere a shadow is allowed to land: not the wall a gap opens above a
  // street, which is a face of a building and not the ground, and not where
  // the block's own shadow is going, which is laid over the traffic later.
  // Everything is drawn its full length and this is what hides it, so a person
  // walking under a wall keeps the same shadow as everyone else.
  function shadowMask(g, boxes) {
    const p = new Path2D(), bl = R(g.walkX);
    p.rect(-1e4, -1e4, 2e4, 2e4);
    for (const b of boxes) {
      p.rect(0, b.gapTop, bl, Math.max(0, b.top - b.gapTop));
      bandTo(p, b, bl);
    }
    return p;
  }
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  // Forty of these are thrown every frame and only a handful are ever
  // different: a light is its direction, its size, its colour and its
  // strength, and where it falls is a translation. Built in its own corner
  // once and moved into place, rather than built again wherever it lands.
  let beams = new Map();

  function beam(x, y, w, h, colour, dir, s) {
    const key = dir + w + "x" + h + colour + s;
    let G = beams.get(key);
    if (!G) {
      G = dir === "down"  ? cx.createLinearGradient(0, 0, 0, h)
        : dir === "up"    ? cx.createLinearGradient(0, h, 0, 0)
        : dir === "right" ? cx.createLinearGradient(0, 0, w, 0)
        :                   cx.createLinearGradient(w, 0, 0, 0);
      G.addColorStop(0, rgba(colour, s));
      G.addColorStop(1, rgba(colour, 0));
      beams.set(key, G);
    }
    cx.save();
    cx.translate(x, y);
    cx.fillStyle = G; cx.fillRect(0, 0, w, h);
    cx.restore();
  }

  // The two directions were the same routine with the axes swapped. One
  // function, and a flag that decides which way the rectangle is laid down.
  function veh(at, front, sp, colour, glass, down) {
    const L = sp.len;
    // Not rounded: snapping a moving rectangle to whole pixels every frame is
    // what made the traffic and the people step rather than glide, and rounding
    // position and length apart left a hairline flickering at the tail.
    const box = (a, b) => down ? cx.fillRect(at, a, CAR_W, b)
                               : cx.fillRect(a, at, b, CAR_W);
    cx.fillStyle = colour; box(front - L, L);
    if (sp.body) { cx.fillStyle = SCENE[sceneKind].cars[2]; box(front - L, L * (1 - sp.body)); }
    cx.fillStyle = glass;
    box(front - L * (sp.hood + sp.glass), L * sp.glass);
    if (sp.rear) box(front - L * (sp.rear + sp.rearH), L * sp.rearH);
  }

  // A cross street is the same section as the avenue at fixed offsets from the
  // top of its band: pavement, parking, lane, parking, pavement. A junction is
  // one piece of ground, so it is drawn in layers across both streets at once
  // rather than each street painting over the other — that is what stops the
  // horizontal street burying the traffic passing under it.
  function drawCrossSurface(g, b, S) {
    const bl = R(g.walkX), thru = R(g.edge);
    const top = b.top, roadTop = b.roadTop, roadBot = b.roadBot;
    // Pavement first and a pixel into the road, then the road over it. Two
    // rectangles that merely meet at a fractional edge each paint that row of
    // pixels at partial strength, and what shows between them is whatever was
    // underneath — a hairline of ground along every kerb.
    cx.save();
    cx.beginPath(); cx.rect(0, top, bl, CROSS_H); cx.clip();
    const lay = (run, y) => {
      for (const s of run) { cx.fillStyle = s.c; cx.fillRect(R(s.y), y, R(s.h) + 1, WALK_W + 1); }
    };
    lay(b.st.walks[0], top);
    lay(b.st.walks[1], roadBot - 1);
    cx.restore();
    cx.fillStyle = S.avenue; cx.fillRect(0, roadTop, thru, ROAD_W);
  }

  // Bar and gap the same width with a gap at each end, so the pattern never
  // runs into the kerb: n bars and n+1 gaps means the unit is span / (2n + 1),
  // with n chosen to land it nearest 8px for whatever is being crossed.
  // One width for a bar and for the blank between two of them, and the same
  // width on every crossing — the two spans are different, 49px over a cross
  // street against 34 over the avenue, so something has to give and it is the
  // clearance at the kerbs. As many bars as the span holds with a blank the
  // width of a bar between each pair, centred, and whatever is left over is
  // clear road at either end rather than a wider blank inside the pattern.
  const BAR = M(1.15);

  function zebra(x, y, across, along, barsRunDown, colour) {
    const n = Math.max(2, Math.floor((across / BAR + 1) / 2));
    const start = (across - (2 * n - 1) * BAR) / 2;
    cx.fillStyle = colour;
    for (let i = 0; i < n; i++) {
      const o = start + BAR * 2 * i;
      if (barsRunDown) cx.fillRect(R(x + o), y, R(BAR), along);
      else cx.fillRect(R(x), y + o, along, BAR);
    }
  }

  // A crossing is the pavement carried across the road, so it sits exactly
  // where the pavement is — not alongside it. Crossing the cross street means
  // standing in the avenue's pavement column; crossing the avenue means
  // standing in one of the cross street's pavements.
  function drawCrossPaint(g, b, S) {
    zebra(g.walkX, b.roadTop, ROAD_W, WALK_W, false, S.paint);
    const av = g.edge - g.roadX;                   // the avenue, kerb to kerb
    zebra(g.roadX, b.top, av, WALK_W, true, S.paint);
    zebra(g.roadX, b.roadBot, av, WALK_W, true, S.paint);
  }

  // Everything below is written in screen coordinates, as it always was. The
  // one translate puts that window where it belongs inside the band, and the
  // algebra leaves the scroll position multiplied by the parallax difference
  // rather than by the whole of it.
  function draw(par, boxes, g, sy) {
    const S = SCENE[sceneKind], W = innerWidth, H = sceneH;
    cx.save();
    cx.translate(0, sy - bandTop);

    if (sceneMode === "clouds") {
      cx.fillStyle = S.map.back; cx.fillRect(0, -LIVE, W, H + 2 * LIVE);
      drawMapGlow(S);
      cx.restore();
      return;
    }

    // 1 — surfaces
    const T = -LIVE, HH = H + 2 * LIVE;                    // the window, with margin
    cx.fillStyle = S.blank; cx.fillRect(0, T, W, HH);     // nothing past the kerb
    cx.fillStyle = S.asphalt; cx.fillRect(0, T, R(g.fieldW), HH);
    cx.fillStyle = S.avenue; cx.fillRect(R(g.roadX), T, R(g.edge) - R(g.roadX), HH);
    const off = ((par % TILE) + TILE) % TILE;
    for (let t = -TILE; t < H + TILE; t += TILE) {
      const base = t - off;
      for (const s of slabs) { cx.fillStyle = s.c; cx.fillRect(R(g.walkX), base + s.y, WALK_W, s.h + 1); }
    }
    // the walls the gap opens on, before the street is laid between them
    for (const b of boxes) {
      cx.fillStyle = S.wallLit;
      cx.fillRect(0, b.gapTop, R(g.fieldW), Math.max(0, b.top - b.gapTop));
      cx.fillStyle = S.wallShade;
      cx.fillRect(0, b.bot, R(g.fieldW), Math.max(0, b.gapBot - b.bot));
    }
    for (const b of boxes) drawCrossSurface(g, b, S);
    for (const b of boxes) {                       // pavement stops at a junction
      cx.fillStyle = S.avenue;
      cx.fillRect(R(g.walkX), b.roadTop, WALK_W, ROAD_W);
    }

    // 2 — paint, before anything drives over it
    for (const b of boxes) drawCrossPaint(g, b, S);

    // 3 — light, before any traffic, so no beam lands on a car
    if (S.night) {
      for (let t = -TILE; t < H + TILE; t += TILE) {      // frontage on the avenue
        const base = t - off;
        for (const L of avLights) {
          const y = base + L.a, len = L.len;
          if (y > H || y + len < 0) continue;
          if (boxes.some(b => y + len > b.top - CORNER && y < b.bot + CORNER)) continue;
          beam(R(g.walkX), y, WALK_W, len, S.gallery, "right", .5);
        }
      }
      for (const b of boxes) for (const L of b.st.lights) {  // and on the block
        if (L.side) beam(L.x, b.roadBot, L.len, WALK_W, S.gallery, "up", .5);
        else        beam(L.x, b.top, L.len, WALK_W, S.gallery, "down", .5);
      }
      for (const c of avCars) {                     // start 2px inside the car
        beam(R(g.lane), c.y + c.spec.len - 2, CAR_W, MR(7), S.head, "down", .5);
        beam(R(g.lane), c.y - MR(3.6), CAR_W, MR(3.9), S.tail, "up", .38);
      }
      for (const b of boxes) {
        const st = b.st;
        const laneY = b.roadTop + LANE_OFF;
        for (const c of st.cars) {
          beam(c.x + c.spec.len - 2, laneY, MR(5.9), CAR_W, S.head, "right", .5);
          beam(c.x - MR(3.1), laneY, MR(3.4), CAR_W, S.tail, "left", .32);
        }
      }
    }

    // 3b — the shopfront, on the wall of the building either side of the gap,
    // hard against its own pavement and on top of whatever light it throws.
    //
    // Both walls, always, at a fixed depth that runs up behind the roof above
    // and down behind the roof below. Drawing only the wall the parallax had
    // opened meant the windows changed sides the instant the gap passed the
    // middle of the screen, which is a snap; running them under the roofs lets
    // the roofs do the hiding, and what you see grows and shrinks with the gap
    // instead of appearing.
    cx.fillStyle = winCol;
    for (const b of winCol ? boxes : []) {
      for (const L of b.st.lights)
        cx.fillRect(L.x, L.side ? b.bot : b.top - WIN_D, L.len, WIN_D);
    }

    // Nobody parks in a junction or on a crossing, so nothing standing there
    // throws a shadow either — those were the ghosts in the intersections.
    const blockedV = (y, len) => boxes.some(b => y + len > b.top && y < b.bot);

    // 3c — what the sun leaves behind, on the ground and under the thing that
    // casts it. It is off the bottom right, so everything throws up and to the
    // left: a person as a long bar with the round of their head at the top of
    // it, a vehicle as its own box with the corners cut.
    if (S.shade) {
      // How far a shadow reaches is how tall the thing is: a box truck stands
      // twice a car and throws twice as far.
      const off = (v) => v.body ? CAR_W * 2 / 3 : CAR_W / 3;
      const pl = M(1.0) * .7071, P = new Path2D();
      for (const p of avParkA) if (!blockedV(p.y, p.spec.len))
        hullTo(P, R(g.parkA), p.y, CAR_W, p.spec.len, off(p.spec));
      for (const c of avCars) hullTo(P, R(g.lane), c.y, CAR_W, c.spec.len, off(c.spec));
      for (const b of boxes) {
        const st = b.st, laneY = b.roadTop + LANE_OFF, stop = g.walkX - 6;
        for (const p of st.parkT) if (p.x + p.spec.len < stop) hullTo(P, p.x, b.roadTop, p.spec.len, CAR_W, off(p.spec));
        for (const p of st.parkB) if (p.x + p.spec.len < stop) hullTo(P, p.x, b.roadBot - PARK_W, p.spec.len, CAR_W, off(p.spec));
        for (const c of st.cars) hullTo(P, c.x, laneY, c.spec.len, CAR_W, off(c.spec));
      }
      for (const p of peds) if (p.y > -20) barTo(P, p.x, p.y, -pl, -pl, PED_R);
      cx.save();
      cx.clip(shadowMask(g, boxes), "evenodd");
      cx.fillStyle = S.shade; cx.fill(P);
      cx.restore();
    }

    // 4 — parked. Nobody parks in a junction or on a crossing.
    for (const p of avParkA) if (!blockedV(p.y, p.spec.len)) veh(R(g.parkA), p.y + p.spec.len, p.spec, p.color, S.glass, true);
    for (const b of boxes) {
      const st = b.st;
      const stop = g.walkX - 6;
      for (const p of st.parkT) if (p.x + p.spec.len < stop) veh(b.roadTop, p.x + p.spec.len, p.spec, p.color, S.glass, false);
      for (const p of st.parkB) if (p.x + p.spec.len < stop) veh(b.roadBot - PARK_W, p.x + p.spec.len, p.spec, p.color, S.glass, false);
    }

    // 5 — everything moving, both directions on the same layer
    for (const c of avCars) veh(R(g.lane), c.y + c.spec.len, c.spec, c.color, S.glass, true);
    for (const b of boxes) {
      const st = b.st;
      const laneY = b.roadTop + LANE_OFF;
      for (const c of st.cars) veh(laneY, c.x + c.spec.len, c.spec, c.color, S.glass, false);
    }

    // 6 — people. Someone on a block is held against their own street rather
    // than against the screen, so they keep their pavement as the page scrolls
    // under them. Done here, not in the step, so a frame drawn without one —
    // a plain scroll — puts them in the right place too.
    for (const w of peds) if (w.axis === "h") {
      const b = boxes.find(x => x.key === w.key);
      w.y = b ? (w.side ? b.roadBot : b.top) + w.off : -999;
    }
    for (const p of peds) if (p.y > -20) disc(p.x, p.y, p.r, p.color);

    // 6b — and the shadow the block itself throws, up from the bottom right
    // across the lower kerb and the cars standing at it. Over them rather than
    // under: they are in it, not casting it. The corner where it meets the
    // avenue is cut at forty-five degrees off the inside of the pavement.
    if (S.shade) { cx.fillStyle = S.shade; cx.fill(blockShade(g, boxes)); }

    // 7 — the crop. Past the kerb there is nothing, so a car or a headlight
    // that overshoots is cut off at the line instead of floating in the blank.
    // Cross traffic is allowed to run well past it before it wraps, which is
    // what stops a car vanishing whole a length short of the edge.
    cx.fillStyle = S.blank; cx.fillRect(R(g.edge), T, W - R(g.edge), HH);
    cx.restore();
  }

  // Everything on the ground is held in screen coordinates on a canvas that
  // does not scroll, so a scroll has to carry it the other way. Both of the
  // paths that draw have to do it. The surfaces are painted straight from the
  // offset, so a fallback draw that moved them without carrying the traffic
  // left the next animated frame to do the whole gap at once — and the street
  // lurched under the roofs. That is the path a phone takes, because frames
  // are throttled during a flick and the fallback is what runs.
  function carry(par) {
    const d = par - lastPar;
    lastPar = par;
    if (sceneMode !== "street") return;
    if (d) {
      for (const w of peds) w.y -= d;
      for (const c of avCars) c.y -= d;
      for (const p of avParkA) p.y -= d;
    }
    // Everything on the avenue is recycled here rather than in the step,
    // because this runs on both of the paths that draw and the step runs on
    // only one of them. A flick is precisely when frames are throttled and the
    // fallback is what runs — so the scroll was carrying the traffic off the
    // top of the street with nothing to bring it back, and the avenue emptied
    // behind you exactly when you were moving fastest.
    const far = sceneH + LIVE, wrap = sceneH + 2 * LIVE;
    for (const p of avParkA) {
      if (p.y < -LIVE) p.y += wrap; else if (p.y > far) p.y -= wrap;
    }
    // A car comes back on just outside the live range, anywhere in a short
    // band of it. Chaining each one behind the last instead sends them further
    // and further down when the scroll is quick, and they never climb back;
    // a band keeps them where the next second of scrolling will need them, and
    // the queue spaces out whatever lands together.
    // A car returning below the street would become the leader, and the queue
    // would clamp whoever was already there back up the road to make room —
    // which reads as a car being shoved backwards. So it gives way to anything
    // already at that end. Only to what is already at that end: measured
    // against every car on the road, one that had drifted far down the page
    // would send every return after it further down still, and none of them
    // ever came back.
    const near = MR(30);
    for (const c of avCars) {
      if (c.y > far) {
        let y = -LIVE - c.spec.len - MR(rnd(0, 34));
        for (const o of avCars) {
          if (o === c || o.y + o.spec.len > -LIVE + near) continue;
          const room = o.y - gapFor(o) - c.spec.len;
          if (room < y) y = room;
        }
        c.y = y;
      } else if (c.y + c.spec.len < -LIVE) {
        let y = far + MR(rnd(0, 34));
        for (const o of avCars) {
          if (o === c || o.y < far - near) continue;
          const room = o.y + o.spec.len + gapFor(c);
          if (room > y) y = room;
        }
        c.y = y;
      }
    }
    for (const w of peds) {
      if (w.axis !== "v") continue;
      if (w.y < -LIVE) w.y = far; else if (w.y > far) w.y = -LIVE;
    }
  }

  function frame(t) {
    rafId = requestAnimationFrame(frame);
    const par = scrollY * PARALLAX;
    const dt = Math.min(.05, (t - lastT) / 1000) || .016;
    lastT = t; clock += dt;
    const sy = scrollY, g = geom();
    placeBand();
    const boxes = sceneMode === "street" && !STILL ? intersections(g) : [];
    carry(par);
    if (!reduceMotion && sceneMode === "street") {
      stepWalkers(dt, g, sceneH, boxes);
      stepAvenue(dt, g, sceneH, boxes);
      stepCross(dt, g, boxes);
    }
    draw(par, boxes, g, sy);
  }

  // Reallocating a full-screen bitmap is megabytes of work, and the address
  // bar asks for one on every change of scroll direction. The canvas keeps the
  // tallest height it has been and the spare hangs below the fold, so a height
  // that shrinks and grows again costs nothing.
  function sizeCanvas() {
    // One canvas pixel per screen pixel. Capped at 2, a phone at 3 was having
    // every frame resampled up by half on its way to the glass — which is a
    // shimmer on every edge that moves, and no amount of care about where the
    // edges are put can help with it. The CSS size is derived back from the
    // bitmap rather than set alongside it, so the two cannot disagree by the
    // rounding and leave the whole scene on a fractional scale.
    const dpr = Math.min(devicePixelRatio || 1, 3);
    sceneH = Math.max(sceneH, innerHeight);
    bandH = Math.round(sceneH * 2);
    const w = Math.round(innerWidth * dpr), h = Math.round(bandH * dpr);
    cv.style.width = w / dpr + "px";
    cv.style.height = h / dpr + "px";
    if (cv.width === w && cv.height === h) return;   // assigning either clears it
    cv.width = w; cv.height = h;
    cv.style.top = bandTop + "px";
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    beams = new Map();               // they belong to the bitmap that just went
  }

  // Kept so the viewport sits in the middle of the band, and moved only when
  // it drifts within a quarter of an end. Moving it is a style write and a
  // redraw in the same frame, so the page never sees one without the other.
  // How tall the page is, asked once when it is built rather than while it is
  // being scrolled: the question forces the browser to work out the whole
  // layout, which on a long list is ten milliseconds. It is only used to keep
  // the band from hanging off the bottom, so a little staleness costs nothing.
  function measureDoc() {
    const clip = document.getElementById("sceneclip");
    docH = clip ? clip.offsetHeight : sceneH;
  }

  function placeBand() {
    const slack = sceneH / 4;
    if (bandH && scrollY > bandTop + slack && scrollY + sceneH < bandTop + bandH - slack) return;
    const want = Math.min(Math.max(0, Math.round(scrollY - sceneH / 2)),
                          Math.max(0, docH - bandH));
    if (want === bandTop) return;
    bandTop = want;
    cv.style.top = bandTop + "px";
  }

  function sceneSetKind(kind, mode) {
    sceneMode = mode || "street";
    document.documentElement.setAttribute("data-mode", sceneMode);
    // the basemap is recoloured out of this scene's own palette, and the
    // controls take the brightest point of the halo around it — computed from
    // the glow rather than copied off it, so it can never fall behind
    const S2 = SCENE[kind], toward = (a, b, t) => toHex(a.map((c, i) => c + (b[i] - c) * t));
    for (const [k, v] of Object.entries(S2.map)) rootStyle.setProperty("--map-" + k, v);
    const back = toRGB(S2.map.back), line = toRGB(S2.map.line);
    rootStyle.setProperty("--map-btn", S2.glow ? toward(back, S2.glow, .5) : "#FFFFFF");
    rootStyle.setProperty("--map-btnink", INK_DARK);
    // Every step of street brightness is the same light — the base tone
    // carried that much further toward the sodium the map itself throws out.
    // Daylight has no such thing, so every step is the street's own colour and
    // the grid comes out flat, which is what daylight looks like.
    const lamp = (t) => S2.glow ? toward(line, S2.glow, t) : S2.map.line;
    rootStyle.setProperty("--map-line0", S2.glow ? toward(line, back, .45) : S2.map.line);
    rootStyle.setProperty("--map-halo", lamp(.12));
    rootStyle.setProperty("--map-line2", lamp(.28));
    rootStyle.setProperty("--map-line3", lamp(.50));
    rootStyle.setProperty("--map-lit", lamp(.68));
    // an unmarked dot: black by day, and at night the colour everything up
    // here is written in
    rootStyle.setProperty("--dot-face", S2.night ? INK_LIGHT : "#000000");
    if (kind === sceneKind && peds.length) return;
    sceneKind = kind;
    document.documentElement.setAttribute("data-scene", kind);
    populate();
  }

  function sceneStart() {
    cv = document.getElementById("scene");
    cx = cv.getContext("2d");
    fitStreet(); sizeCanvas(); measureDoc(); populate();
    // A phone changes the viewport height whenever the address bar hides or
    // shows, which is on every change of scroll direction. Rebuilding the
    // street there restarted every car and every walker, so only a genuine
    // change of width repopulates; a height change just resizes the canvas.
    let lastW = innerWidth;
    addEventListener("resize", () => {
      const rotated = Math.abs(innerWidth - lastW) > 2;
      if (rotated) { lastW = innerWidth; sceneH = innerHeight; fitStreet(); }   // a new scene
      sizeCanvas(); measureDoc();
      if (rotated) populate();
    }, { passive: true });
    lastPar = scrollY * PARALLAX;
    addEventListener("scroll", () => {
      // Fill in whenever frames are not keeping up, and half rate is the
      // line. The gate used to be 120ms, which is the wrong way round: a
      // phone running frames at ten a second kept the fallback switched off
      // and moved the ground ten times a second while the compositor glided
      // the roofs past at sixty. Drawing twice in a frame costs a millisecond
      // and looks like nothing; not drawing is the thing you can see.
      if (performance.now() - lastT > 32) {
        const sy = scrollY, par = sy * PARALLAX, g = geom();
        placeBand();
        const boxes = sceneMode === "street" && !STILL ? intersections(g) : [];
        carry(par);
        draw(par, boxes, g, sy);
      }
    }, { passive: true });
    rafId = requestAnimationFrame(frame);
  }

  // ---- the map, seen through a break in the cloud ------------------
  // Still, not animated. At night the city throws a glow out of the opening;
  // it runs off the four sides and stops short of the corners, so it reads as
  // a cross rather than a halo — the same shape the gallery light makes.
  function drawMapGlow(S) {
    const wrap = document.getElementById("mapwrap");
    if (!wrap || !S.glow) return;
    const r = wrap.getBoundingClientRect(), D = 44;
    beam(R(r.left), R(r.top - D), R(r.width), D, S.glow, "up", .5);
    beam(R(r.left), R(r.bottom), R(r.width), D, S.glow, "down", .5);
    beam(R(r.left - D), R(r.top), D, R(r.height), S.glow, "left", .5);
    beam(R(r.right), R(r.top), D, R(r.height), S.glow, "right", .5);
  }


  function renderTopNav() {
    const nav = document.getElementById("topnav");
    nav.innerHTML = PAGES.map(p =>
      `<a data-page="${p.id}" class="${currentPage === p.id ? "active" : ""}${p.nav ? " sub" : ""}"` +
      ` title="${escapeHTML(p.label)}">${p.nav || p.label}</a>`
    ).join("");
    nav.querySelectorAll("a").forEach(a => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        const prevWrap = document.getElementById("mapwrap");
        if (prevWrap) saveCamera(prevWrap);
        currentPage = a.dataset.page;
        renderTopNav();
        renderContent();
      });
    });
  }

  function renderContent() {
    const content = document.getElementById("content");
    // Openings is an opening night; On View is daylight. The scene follows the
    // page rather than the system theme, which is the whole point of it.
    sceneSetKind(currentPage.startsWith("onview") ? "day" : "night",
                 currentPage.endsWith("-map") ? "clouds" : "street");
    // don't keep polling GPS on the list pages; the map branch restarts it
    stopLocationTimer();

    if (currentPage === "opening") {
      content.innerHTML = renderOpeningPage();
      content.querySelectorAll(".daymap-link").forEach(a => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          openingMapDate = a.dataset.date;
          currentPage = "opening-map";
          renderTopNav();
          renderContent();
        });
      });
    } else if (currentPage === "onview") {
      content.innerHTML = renderOnViewPage();
      content.querySelectorAll(".tabs a[data-nbhd]").forEach(a => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          onViewNeighborhood = a.dataset.nbhd || null;
          renderContent();
        });
      });
    } else if (currentPage === "opening-map" || currentPage === "onview-map") {
      const kind = currentPage === "opening-map" ? "opening" : "onview";
      content.innerHTML = renderMapPage(kind);
      content.querySelectorAll(".tabs a[data-date]").forEach(a => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          const prevWrap = document.getElementById("mapwrap");
          if (prevWrap) saveCamera(prevWrap);
          openingMapDate = a.dataset.date;
          renderContent();
        });
      });
      insertBasemap();
      applyMapScale();
      const wrap = document.getElementById("mapwrap");
      document.getElementById("zoomIn")?.addEventListener("click", () => zoomBy(1.6));
      document.getElementById("zoomOut")?.addEventListener("click", () => zoomBy(1 / 1.6));
      document.getElementById("locate")?.addEventListener("click", toggleLocation);
      if (locationOn) startLocationTimer();
      if (wrap) attachPinchHandlers(wrap);
    }

    // the nav is the bottom edge of the header box unless subtabs follow it
    document.documentElement.toggleAttribute("data-subtabs", !!content.querySelector(".tabs"));
    headEls = content.querySelectorAll(".date-head");
    measureDoc();
    // Every block's traffic, parking, frontage and crowd is built now rather
    // than the first time that heading scrolls into view. There are never more
    // than a dozen and it is a millisecond here; done during a flick it is a
    // dropped frame, at whatever speed happens to reach the next heading.
    if (sceneMode === "street") {
      const S = SCENE[sceneKind], W = geom().fieldW;
      for (const el of headEls) crossFor(el.dataset.key, S, W);
    }
    applyBookmarkStyles();
    saveView();
  }

  async function main() {
    document.getElementById("content").innerHTML = "loading...";
    restoreView();
    sceneSetKind(currentPage.startsWith("onview") ? "day" : "night",
                 currentPage.endsWith("-map") ? "clouds" : "street");
    sceneStart();
    renderTopNav();
    loadBookmarks();

    // delegated so it survives every re-render of the list
    document.getElementById("content").addEventListener("click", (e) => {
      const btn = e.target.closest(".bm");
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      toggleBookmark(btn.dataset.id);
    });

    try {
      const res = await fetch("data/nyc.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      latestShows = await res.json();
    } catch (e) {
      document.getElementById("content").innerHTML =
        `<div class="empty">couldn't load show data — try reloading</div>`;
      return;
    }

    renderUpdatedLine();
    renderContent();
    // start the map fetch now so the first map tab is not waiting on it
    loadBasemap().catch(() => {});
  }

  main();
</script>
</body>
</html>
